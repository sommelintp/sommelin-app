<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sommelin — マイセラー</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 2026-07-30: --burgundy/--wine-dark/--gold/--text/--text-sub/--border/--line-green は
     sommelin-ui.css（後読み）のブランドトークンに一本化。ページ固有のみ残す */
  --gold-light: #fdf6e8;
  --bg: var(--paper, #F5F3F0);
  --white: #ffffff;
  --card-bg: #ffffff; /* .jp-dish/.jp-chipが参照。未定義だったため明示 */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ── HEADER ── */
.header {
  background: linear-gradient(175deg, var(--wine-dark) 0%, var(--wine) 90%);
  border-bottom: 1px solid var(--foil);
  padding: 18px 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-back {
  background: none; border: none; color: rgba(255,255,255,0.7);
  font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1;
}
.header-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: .02em; color: white; }
.header-sub { font-size: 11px; color: var(--foil-pale); font-weight: 500; margin-top: 1px; }
.header-add {
  width: 34px; height: 34px; background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; color: white;
  font-weight: 300; line-height: 1;
}

/* ── TABS ── */
.tabs {
  background: white;
  display: flex;
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  flex: 1; padding: 13px 0; text-align: center;
  font-size: 12px; font-weight: 700; color: var(--text-sub);
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s;
}
.tab-btn.active { color: var(--burgundy); border-bottom-color: var(--foil); }

/* ── PANELS ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── CELLAR SUMMARY ── */
.summary-row {
  background: white;
  padding: 18px 20px;
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.summary-row::-webkit-scrollbar { display: none; }
.summary-item {
  flex: 1; min-width: 70px; text-align: center;
  padding: 0 8px;
  border-right: 1px solid var(--border);
}
.summary-item:last-child { border-right: none; }
.summary-val {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700; color: var(--burgundy); line-height: 1;
  margin-bottom: 3px;
}
.summary-label { font-size: 10px; color: var(--text-sub); font-weight: 600; }
.summary-sub { font-size: 9px; color: var(--text-sub); margin-top: 2px; }

/* ── CELLAR FILTERS ── */
.filter-row {
  padding: 14px 16px 10px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  padding: 6px 14px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--border); background: white; color: var(--text-sub);
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: all 0.15s;
}
.filter-chip.active {
  background: var(--wine-dark); border-color: var(--wine-dark); color: white;
}

/* ── CELLAR SWITCHER（AG節） ── */
.cellar-switch-row {
  background: white;
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.cellar-switch-row::-webkit-scrollbar { display: none; }
.cellar-chip {
  padding: 7px 14px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 700;
  border: 1.5px solid var(--border); background: white; color: var(--text);
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: all 0.15s;
}
.cellar-chip.active {
  background: var(--burgundy); border-color: var(--burgundy); color: white;
}
.cellar-chip-add {
  padding: 7px 14px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 700;
  border: 1.5px dashed var(--border); background: none; color: var(--text-sub);
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.cellar-badge {
  display: inline-block; font-size: 9.5px; font-weight: 700; color: var(--wine-dark);
  background: var(--gold-light); border-radius: 6px; padding: 1px 6px; margin-top: 3px;
}
.cellar-manage-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.cellar-manage-item:last-child { border-bottom: none; }
.cellar-manage-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
.cellar-manage-btn {
  font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: white; color: var(--text-sub); cursor: pointer;
}
.cellar-manage-btn.danger { color: #c0392b; border-color: #f0c4bd; }

/* ── SORT ── */
.sort-row { padding: 0 16px 10px; display: flex; justify-content: flex-end; }
.sort-select {
  font-size: 12px; font-weight: 700; color: var(--text); background: white;
  border: 1.5px solid var(--border); border-radius: var(--r-chip); padding: 6px 10px;
  font-family: inherit;
}

/* ── WINE CARDS ── */
.wine-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

.cellar-card {
  background: white; border-radius: var(--r-card); border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  overflow: hidden; cursor: pointer;
  transition: transform 0.15s;
}
.cellar-card:active { transform: scale(0.985); }
.cellar-card-inner { display: flex; gap: 0; }
.cellar-card-label {
  width: 58px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  background: var(--burgundy-pale);
  position: relative;
}
.cellar-card-label.photo {
  background: linear-gradient(160deg,var(--wine-ink),var(--wine-dark));
}
.cellar-card-label.photo span { opacity: 0.3; font-size: 20px; }
.cellar-card-body { flex: 1; padding: 13px 14px 11px; }
.cellar-card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 6px; margin-bottom: 2px;
}
.cellar-name { font-size: 13px; font-weight: 800; color: var(--text); line-height: 1.3; flex: 1; }
.cellar-vintage {
  font-size: 11px; font-weight: 700;
  color: var(--burgundy); background: var(--burgundy-pale);
  border-radius: 8px; padding: 2px 7px; white-space: nowrap; flex-shrink: 0;
}
.cellar-producer { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
.cellar-region { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }
.cellar-bottom { display: flex; align-items: center; gap: 8px; }
.cellar-purchase {
  font-size: 11px; color: var(--text-sub); flex: 1;
  display: flex; align-items: center; gap: 4px;
}
.cellar-stock {
  display: flex; align-items: center; gap: 6px;
}
.stock-badge {
  background: var(--gold-light); border: 1px solid #e8d090;
  border-radius: 12px; padding: 4px 10px;
  font-size: 12px; font-weight: 800; color: var(--gold);
  display: flex; align-items: center; gap: 4px;
}
.stock-minus, .stock-plus {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; cursor: pointer; border: none;
  flex-shrink: 0;
}
.stock-minus { background: var(--burgundy-pale); color: var(--burgundy); }
.stock-plus  { background: var(--gold-light); color: var(--gold); }
.stock-minus:active, .stock-plus:active { opacity: 0.7; }

/* ── JOURNAL ── */
.journal-list { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.journal-date-header {
  font-size: 11px; font-weight: 800; color: var(--text-sub);
  letter-spacing: 0.5px; padding: 4px 0 2px;
  display: flex; align-items: center; gap: 8px;
}
.journal-date-header::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.journal-card {
  background: white; border-radius: var(--r-card); border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  padding: 14px; cursor: pointer;
  transition: transform 0.15s;
}
.journal-card:active { transform: scale(0.985); }
.journal-card-top {
  display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px;
}
.journal-cat-dot {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.journal-card-info { flex: 1; }
.journal-wine-name { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
.journal-wine-sub { font-size: 11px; color: var(--text-sub); }
.journal-stars { display: flex; gap: 2px; }
.star { font-size: 14px; }
.journal-note {
  font-size: 12px; color: var(--text-sub); line-height: 1.6;
  border-top: 1px solid var(--bg); padding-top: 8px;
}
.journal-place {
  font-size: 11px; color: var(--text-sub);
  display: flex; align-items: center; gap: 4px;
  margin-top: 6px;
}
/* ===== PAIRING FEEDBACK on journal card (#0・2026-07-18) ===== */
.jp-row { margin-top: 8px; border-top: 1px solid var(--bg); padding-top: 8px; }
.jp-btn {
  background: none; border: none; padding: 2px 0; cursor: pointer;
  font-size: 12px; color: var(--text-sub); font-weight: 600;
}
.jp-btn:active { opacity: .6; }
.jp-slot:empty { display: none; }
.jp-panel { margin-top: 8px; }
.jp-intro { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
.jp-dish {
  width: 100%; box-sizing: border-box; border: 1.5px solid var(--border);
  border-radius: var(--r-chip); padding: 8px 10px; font-size: 13px; color: var(--text);
  background: var(--card-bg); margin-bottom: 8px;
}
.jp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.jp-chip {
  background: var(--card-bg); border: 1.5px solid var(--border);
  border-radius: var(--r-pill); padding: 5px 11px; font-size: 12px;
  color: var(--burgundy, #7a2e3a); font-weight: 600; cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.jp-chip:active { background: var(--burgundy, #7a2e3a); color: #fff; }
.jp-chip--mariage { border-color: var(--gold, #C9973A); color: var(--gold, #C9973A); }
.jp-chip--mariage:active { background: var(--gold, #C9973A); color: #fff; }
.jp-thanks { font-size: 12px; color: var(--text-sub); font-style: italic; margin-top: 8px; }

/* ── STATS ── */
.stats-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.stat-card {
  background: white; border-radius: var(--r-card); border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.stat-card-title {
  font-size: 13px; font-weight: 800; color: var(--text);
  padding: 14px 16px 0;
}
.stat-chart { padding: 14px 16px; }

/* bar chart */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-label { font-size: 11px; color: var(--text-sub); width: 80px; flex-shrink: 0; }
.bar-track { flex: 1; height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; transition: width 0.6s ease; }
.bar-count { font-size: 11px; font-weight: 700; color: var(--text); width: 30px; text-align: right; flex-shrink: 0; }

/* cat breakdown */
.cat-breakdown { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 14px 16px; }
.cat-item { text-align: center; }
.cat-item-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin: 0 auto 5px;
}
.cat-item-count { font-size: 15px; font-weight: 900; color: var(--text); }
.cat-item-label { font-size: 9px; color: var(--text-sub); font-weight: 600; }

/* rating chart */
.rating-chart { padding: 14px 16px; }
.rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rating-stars { font-size: 11px; white-space: nowrap; width: 60px; }
.rating-bar-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.rating-bar-fill { height: 100%; border-radius: 4px; background: var(--gold); }
.rating-count { font-size: 11px; color: var(--text-sub); width: 20px; text-align: right; }

/* spending */
.spending-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--bg);
  font-size: 13px;
}
.spending-row:last-child { border-bottom: none; }
.spending-label { color: var(--text-sub); font-weight: 600; }
.spending-val { font-weight: 800; color: var(--text); }
.spending-val.highlight { color: var(--burgundy); font-size: 15px; }

/* ── ADD MODAL ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  z-index: 200; display: none; align-items: flex-end;
}
.modal-bg.open { display: flex; }
.modal {
  background: white; border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  width: 100%; max-width: 430px; margin: 0 auto;
  padding: 0 0 44px; max-height: 92vh;
  overflow-y: auto; animation: slideUp 0.28s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.modal-handle {
  width: 36px; height: 4px; background: #ddd;
  border-radius: 2px; margin: 12px auto 0;
}
.modal-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h3 { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: .02em; }
.modal-close-btn {
  width: 28px; height: 28px; background: var(--bg); border: none;
  border-radius: 50%; font-size: 14px; cursor: pointer; color: var(--text-sub);
  display: flex; align-items: center; justify-content: center;
}
.modal-body-pad { padding: 20px; }
.field-label {
  font-size: 11px; font-weight: 800; color: var(--text-sub);
  letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px;
}
.field-input {
  width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 11px 14px; font-size: 14px; color: var(--text);
  background: white; outline: none; margin-bottom: 16px;
  font-family: inherit;
}
.field-input:focus { border-color: var(--burgundy); }
.cat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.cat-chip {
  padding: 7px 14px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--border); background: white; color: var(--text-sub);
  cursor: pointer; transition: all 0.15s;
}
.cat-chip.active { background: var(--wine-dark); border-color: var(--wine-dark); color: white; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.camera-area {
  border: 2px dashed var(--border); border-radius: var(--r-card);
  padding: 28px; text-align: center; cursor: pointer;
  margin-bottom: 16px; background: var(--bg);
  transition: all 0.15s;
}
.camera-area:active { background: var(--burgundy-pale); border-color: var(--burgundy); }
.camera-area .icon { font-size: 32px; margin-bottom: 8px; }
.camera-area .label { font-size: 13px; font-weight: 700; color: var(--text-sub); }
.camera-area .sub { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
.save-btn {
  width: 100%; background: var(--burgundy); color: white;
  border: none; border-radius: var(--r-card); padding: 16px;
  font-size: 15px; font-weight: 800; cursor: pointer;
  margin-top: 4px;
}
.save-btn:active { opacity: 0.85; }

/* ── DETAIL MODAL ── */
.detail-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.detail-section:last-child { border-bottom: none; }
.detail-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--bg); font-size: 13px;
}
.detail-row:last-child { border-bottom: none; }
.detail-label { color: var(--text-sub); font-weight: 600; }
.detail-val { color: var(--text); font-weight: 700; }
.drink-btn {
  width: 100%; background: var(--wine-dark); color: white;
  border: none; border-radius: var(--r-card); padding: 15px;
  font-size: 14px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.drink-btn:active { opacity: 0.85; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: white; border-top: 1px solid var(--border);
  display: flex; padding: 8px 0 16px; z-index: 40;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px; cursor: pointer;
  background: none; border: none; padding: 4px 0;
  text-decoration: none;
}
.nav-btn .icon { font-size: 20px; }
.nav-btn .label { font-size: 10px; color: var(--text-sub); font-weight: 700; }
.nav-btn.active .label { color: var(--burgundy); }
.nav-btn.active .icon { filter: none; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--wine-dark); color: white; border-radius: var(--r-pill);
  padding: 10px 20px; font-size: 13px; font-weight: 700;
  z-index: 300; opacity: 0; transition: opacity 0.25s;
  pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ── セラーを写真で管理する（2026-10-26・アプリ5への依頼 A〜E） ── */
.value-bar { background: white; padding: 12px 20px 14px; border-bottom: 1px solid var(--border); }
.value-main { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.value-label { font-size: 11px; font-weight: 700; color: var(--text-sub); }
.value-num { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--burgundy); }
.value-count { font-size: 11px; color: var(--text); font-weight: 700; margin-top: 2px; }
.value-note { font-size: 10px; color: var(--text-sub); margin-top: 4px; line-height: 1.5; }
.cellar-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 0; }
.cellar-action-btn {
  padding: 11px 8px; border-radius: 12px; border: 1.5px solid var(--border); background: white;
  font-size: 12.5px; font-weight: 800; color: var(--wine-dark); cursor: pointer; font-family: inherit;
}
.cellar-action-btn.primary { background: var(--wine-dark); border-color: var(--wine-dark); color: white; }
.cellar-ref { font-size: 10.5px; color: var(--text-sub); margin-bottom: 4px; }
.cellar-prov { font-size: 10.5px; color: var(--wine-dark); font-weight: 700; margin-bottom: 4px; }
.sheet-row { padding: 12px 0; border-bottom: 1px solid var(--bg); }
.sheet-row:last-child { border-bottom: none; }
.sheet-sub { font-size: 11.5px; color: var(--text-sub); line-height: 1.6; }
.sheet-btn {
  padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--burgundy); background: white;
  color: var(--burgundy); font-size: 12px; font-weight: 800; cursor: pointer; font-family: inherit; flex-shrink: 0;
}
.sheet-btn.done { border-color: var(--border); color: var(--text-sub); pointer-events: none; }
.bulk-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bg); }
.bulk-row img { width: 40px; height: 54px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
.bulk-check { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--burgundy); }
.bulk-info { flex: 1; min-width: 0; }
.bulk-name { font-size: 13px; font-weight: 800; color: var(--text); }
.bulk-meta { font-size: 11px; color: var(--text-sub); }
.bulk-n { width: 56px; padding: 6px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; text-align: center; font-family: inherit; }
.db-badge { display: inline-block; font-size: 9.5px; font-weight: 700; color: var(--burgundy); border: 1px solid var(--burgundy); opacity: .6; padding: 0 5px; border-radius: 5px; margin-left: 4px; }

    <div class="filter-chip active" onclick="filterCat('all',this)" data-i18n="filter_all">すべて</div>

    <div class="filter-chip" onclick="filterCat('white',this)" data-i18n="cat_chip_white">🍾 白</div>
    <div class="filter-chip" onclick="filterCat('red',this)" data-i18n="cat_chip_red">🍷 赤</div>

    <div class="filter-chip" onclick="filterCat('orange',this)" data-i18n="cat_chip_orange">🟠 橙</div>

      <option value="name" data-i18n="sort_name">銘柄名順</option>
      <option value="vintage" data-i18n="sort_vintage">ヴィンテージ順</option>
      <option value="price_desc" data-i18n="sort_price_desc">価格が高い順</option>

      <option value="region" data-i18n="sort_region">産地順</option>

  <div class="wine-list" id="cellarList"></div>

<!-- ===== ADD MODAL ===== -->
<div class="modal-bg" id="addModalBg" onclick="closeAddModal(event)">
  <div class="modal" id="addModal">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <h3 data-i18n="add_title">ワインを追加</h3>
      <button class="modal-close-btn" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body-pad">
      <!-- スキャン起動: カメラ直起動 / 既存写真から選択 の2択 -->
      <div class="scan-actions" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <a class="camera-area" href="scouter.html?autostart=1" style="text-decoration:none;color:inherit;display:block;margin:0;">
          <div class="icon">📷</div>
          <div class="label" data-i18n="scan_label">ラベルをスキャン</div>
          <div class="sub" data-i18n="scan_sub">カメラを直接起動</div>
        </a>
        <a class="camera-area" href="scouter.html?openPhoto=1" style="text-decoration:none;color:inherit;display:block;margin:0;">
          <div class="icon">📁</div>
          <div class="label" data-i18n="scan_photo_label">写真から選ぶ</div>
          <div class="sub" data-i18n="scan_photo_sub">複数枚まとめてOK</div>
        </a>
      </div>

      <select class="field-input" id="f-cellar"></select>

      <div class="field-label" data-i18n="field_category">カテゴリ</div>
      <div class="cat-chips">
        <div class="cat-chip active" onclick="selectCat(this,'sparkling')" data-i18n="cat_chip_sparkling">🥂 泡</div>
        <div class="cat-chip"       onclick="selectCat(this,'white')" data-i18n="cat_chip_white">🍾 白</div>
        <div class="cat-chip"       onclick="selectCat(this,'red')" data-i18n="cat_chip_red">🍷 赤</div>
        <div class="cat-chip"       onclick="selectCat(this,'rose')" data-i18n="cat_chip_rose">🌸 ロゼ</div>
        <div class="cat-chip"       onclick="selectCat(this,'orange')" data-i18n="cat_chip_orange">🟠 橙</div>
      </div>
      <!-- Fields -->
      <div class="field-label" data-i18n="field_name">ワイン名</div>
      <input class="field-input" id="f-name" data-i18n-ph="ph_name" placeholder="例: Gevrey-Chambertin">
      <div class="field-label" data-i18n="field_producer">生産者</div>
      <input class="field-input" id="f-producer" data-i18n-ph="ph_producer" placeholder="例: Rossignol-Trapet">
      <div class="field-row">
        <div>
          <div class="field-label" data-i18n="field_vintage">ヴィンテージ</div>
          <input class="field-input" id="f-vintage" placeholder="2020">
        </div>
        <div>
          <div class="field-label" data-i18n="field_bottles">本数</div>
          <input class="field-input" id="f-bottles" type="number" min="1" value="1">
        </div>
      </div>
      <div class="field-label" data-i18n="field_region">産地</div>
      <input class="field-input" id="f-region" data-i18n-ph="ph_region" placeholder="例: ブルゴーニュ, フランス">
      <div class="field-label" data-i18n="field_grapes">品種</div>
      <input class="field-input" id="f-grapes" data-i18n-ph="ph_grapes" placeholder="例: ピノ・ノワール">
      <div class="field-row">
        <div>
          <div class="field-label" data-i18n="field_price">購入価格（¥）</div>
          <input class="field-input" id="f-price" type="number" placeholder="8800">
        </div>
        <div>
          <div class="field-label" data-i18n="field_date">購入日</div>
          <input class="field-input" id="f-date" type="date">
        </div>
      </div>
      <!-- 来歴（依頼 E-1）。どれも任意。中身は openAddModal で provenanceFieldsHtml から作る -->
      <div id="addProvFields"></div>
      <div class="field-label" data-i18n="field_note">メモ</div>
      <input class="field-input" id="f-note" data-i18n-ph="ph_note" placeholder="思い出・試飲メモなど">
      <button class="save-btn" onclick="saveWine()" data-i18n="save_btn">セラーに追加</button>
    </div>
  </div>
</div>

let LANG = (() => { try { return localStorage.getItem('somm_lang') || (navigator.language && navigator.language.startsWith('ja') ? 'ja' : 'en'); } catch (e) { return 'ja'; } })();
function t(key, vars) {
  const d = I18N[LANG] || I18N.ja;
  let s = (d && d[key] != null) ? d[key] : (I18N.ja[key] != null ? I18N.ja[key] : key);
  if (vars) { for (const k in vars) { s = s.split('{' + k + '}').join(String(vars[k])); } }
  return s;
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
}
applyI18n();

// 空で開始し、localStorage（端末キャッシュ）→サーバー（user_cellar）の順に実データを反映する。
let cellar = [];

// ── 端末に保存（localStorageはオフラインキャッシュ。正本はサーバーのuser_cellar） ──
const CELLAR_KEY = 'somm_cellar_v1';
const CELLAR_API_BASE = 'https://sommelin-trade-platform-1076605563046.asia-northeast1.run.app';
try { const _s = localStorage.getItem(CELLAR_KEY); if (_s) { const _a = JSON.parse(_s); if (Array.isArray(_a)) cellar = _a; } } catch (e) {}
nextId = Math.max(nextId, 101, ...cellar.map(w => (w.id || 0) + 1));
function saveCellar(){ try { localStorage.setItem(CELLAR_KEY, JSON.stringify(cellar)); } catch (e) {} }

// サーバー同期: 変更時にupsert（アカウント紐付け済みなら他端末にも反映される）
function syncWineToServer(w){
  let uid=null; try{ uid=localStorage.getItem('somm_uid'); }catch(e){}
  if(!uid) return;
  authFetch(CELLAR_API_BASE+'/api/cellar',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ userId:uid, clientRowId:String(w.id), cellarId:w.cellarId||null, name:w.name, vintage:w.vintage,
      region:w.region, producer:w.producer, cat:w.cat, bottles:w.bottles, note:w.note, isPublic: !!w.isPublic })
  }).catch(()=>{});
}

// ── CELLARS（AG節・2026-07-13: 複数セラー対応） ──
let cellars = [];               // {id,name,emoji,sort_order}[]
let currentCellarId = null;     // null = 全セラー横断
let currentSort = 'date_desc';

function myUid(){ try{ return localStorage.getItem('somm_uid'); }catch(e){ return null; } }

async function loadCellarsFromServer(){
  const uid = myUid();
  if(!uid) return;
  try{
    const r = await authFetch(CELLAR_API_BASE+'/api/cellars?userId='+encodeURIComponent(uid));
    if(!r.ok) return;
    const { items } = await r.json();
    cellars = Array.isArray(items) ? items : [];
    renderCellarSwitch();
  }catch(e){}
}

function renderCellarSwitch(){
  const row = document.getElementById('cellarSwitchRow');
  if(!row) return;
  if(!cellars.length){ row.innerHTML = ''; row.style.display = 'none'; return; }
  row.style.display = 'flex';
  let html = `<div class="cellar-chip${currentCellarId===null?' active':''}" onclick="selectCellar(null)">${esc(t('cellar_all'))}</div>`;
  cellars.forEach(c => {
    html += `<div class="cellar-chip${currentCellarId===c.id?' active':''}" onclick="selectCellar('${c.id}')">${esc(c.emoji||'🍾')} ${esc(c.name)}</div>`;
  });
  html += `<div class="cellar-chip-add" onclick="openCellarModal()">${esc(t('cellar_add_chip'))}</div>`;
  html += `<div class="cellar-chip-add" onclick="openCellarModal(true)">${esc(t('cellar_manage'))}</div>`;
  row.innerHTML = html;
}

function selectCellar(id){
  currentCellarId = id;
  renderCellarSwitch();
  renderSummary();
  renderCellar();
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let cellarModalRenameId = null; // nullなら新規作成モード

function closeCellarModal(e){

// ── ソート ──
function setSort(v){ currentSort = v; renderCellar(); }
function sortWines(list){
  const arr = list.slice();
  switch(currentSort){
    case 'date_asc': return arr.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    case 'name': return arr.sort((a,b)=> String(a.name).localeCompare(String(b.name),'ja'));
    case 'vintage': return arr.sort((a,b)=> String(b.vintage).localeCompare(String(a.vintage)));
    case 'price_desc': return arr.sort((a,b)=> (b.price||0)-(a.price||0));
    case 'bottles_desc': return arr.sort((a,b)=> (b.bottles||0)-(a.bottles||0));
    case 'region': return arr.sort((a,b)=> String(a.region).localeCompare(String(b.region),'ja'));
    case 'date_desc': default: return arr.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  }
}

// ページロード時: サーバーの内容を取得し、端末キャッシュより新しければ描画に反映
async function loadCellarFromServer(){
  let uid=null; try{ uid=localStorage.getItem('somm_uid'); }catch(e){}
  if(!uid) return;
  try{
    const r = await authFetch(CELLAR_API_BASE+'/api/cellar?userId='+encodeURIComponent(uid));
    if(!r.ok) return;
    const { items } = await r.json();
    if(!Array.isArray(items) || !items.length) return;
    const byRowId = {}; cellar.forEach(w => { byRowId[String(w.id)] = w; });
    items.forEach(it => {
      const rowId = it.client_row_id || it.id;
      byRowId[rowId] = {
        id: isNaN(Number(rowId)) ? rowId : Number(rowId),
        cat: it.cat || 'red', name: it.name || t('unnamed'), producer: it.producer || '—',
        vintage: it.vintage || '—', region: it.region || '—', grapes: '—',
        bottles: it.bottles != null ? it.bottles : 1, price: 0,
        date: (it.updated_at||'').split('T')[0] || '', note: it.note || '', hasLabel:false,
        isPublic: !!it.is_public, cellarId: it.cellar_id || null,
      };
    });
    cellar = Object.values(byRowId).filter(w => w.bottles > 0);
    nextId = Math.max(nextId, 101, ...cellar.map(w => (typeof w.id==='number'?w.id:0) + 1));
    saveCellar();
    renderSummary(); renderCellar();
  }catch(e){}
}

// サーバー在庫（cellar_bottles・④⑤⑦）: スカウターから写真つきで追加された在庫。
//   既存のlocalStorage在庫機構とは別軸で読み・表示・削除する（回帰リスクを避けるため独立）。
//   写真は署名付きURL、本数±はPATCH、削除はDELETE /api/cellar/bottles。

let serverBottles = [];

// 表示対象（現在のセラー絞り込み＋カテゴリ絞り込みに従う）
function serverBottlesScoped(){
  // 2026-10-26: 在庫は status='in_stock' だけ。飲み終わった行は consumed で残る（記録タブに出る）
  let arr = serverBottles.filter(b => (b.bottles||0) > 0 && (!b.status || b.status === 'in_stock'));
  if (currentCellarId !== null) arr = arr.filter(b => b.cellar_id === currentCellarId);

function renderServerBottleCards(){
  let arr = serverBottlesScoped();

// 2026-10-26: −1 と最後の1本は DELETE ではなく consume（依頼 B）。行は 0本・consumed で残り、
// taste_items に1行入る＝記録タブに「いつ何を飲んだか」が残る。DELETE は登録の間違いを消すときだけ（sbDelete）。
async function sbChangeStock(id, delta){
  if (delta < 0) return sbDrinkOne(id);
  const b = serverBottles.find(x => String(x.id) === String(id));
  if (!b) return;
  const newVal = (b.bottles||0) + delta;
  const previousStock = b.bottles;
  const uid = myUid();
  b.bottles = newVal; // 楽観更新
  showToast(t('toast_plus1'));
  renderSummary(); renderCellar();
  try{
    const response = await authFetch(CELLAR_API_BASE+'/api/cellar/bottles/'+encodeURIComponent(id), {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId:uid, bottles:newVal })
    });
    if (!response.ok) throw new Error('stock update failed: ' + response.status);
  }catch(e){
    b.bottles = previousStock;
    renderSummary(); renderCellar();
    await loadServerBottles();
    showToast(t('sb_update_fail'));
  }
}
// 1本飲んだ（POST /api/cellar/bottles/:id/consume）。note = 誰と飲んだ・ひとこと（任意）。成功で true
const drinkInflight = new Set();
async function sbDrinkOne(id, note){
  const b = serverBottles.find(x => String(x.id) === String(id));
  const uid = myUid();
  if (!b || !uid || drinkInflight.has(String(id))) return false;
  drinkInflight.add(String(id));   // 連打で2本減らさない
  try{
    const r = await authFetch(CELLAR_API_BASE+'/api/cellar/bottles/'+encodeURIComponent(id)+'/consume', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: uid, note: note || null })
    });
    if (!r.ok) throw new Error('consume failed: ' + r.status);
    const d = await r.json();
    b.bottles = d.bottles != null ? d.bottles : Math.max(0, (b.bottles||0) - 1);
    if (d.status) b.status = d.status;
    if (note && d.noteSaved === false) showToast(t('toast_drank_note_unsaved'));
    else showToast(b.bottles === 0 ? t('toast_last') : t('toast_minus1'));
    renderSummary(); renderCellar(); renderStats();
    loadJournal();   // 記録タブに1行増える
    return true;
  }catch(e){
    showToast(t('sb_update_fail'));
    await loadServerBottles();
    return false;
  }finally{ drinkInflight.delete(String(id)); }
}
async function sbDelete(id){
  if (!confirm(t('sb_delete_confirm'))) return;
  let uid=null; try{ uid=localStorage.getItem('somm_uid'); }catch(e){}
  const previousRows = serverBottles.slice();
  serverBottles = serverBottles.filter(x => String(x.id)!==String(id));
  renderSummary(); renderCellar();
  try{
    const response = await authFetch(CELLAR_API_BASE+'/api/cellar/bottles/'+encodeURIComponent(id)+'?userId='+encodeURIComponent(uid), { method:'DELETE' });
    if (!response.ok) throw new Error('stock delete failed: ' + response.status);
    showToast(t('sb_deleted'));
  }catch(e){
    serverBottles = previousRows;
    renderSummary(); renderCellar();
    await loadServerBottles();
    showToast(t('sb_update_fail'));
  }
}

let journal = [];          // {id,name,producer,iro,kuni,chiiki,vintage,price,ts,imageUrl}[]

// 色（iro: 「赤」「白」等）→ catCfgキー
function journalCatOf(iro){
  const s = String(iro||'');
  if (/泡|スパークリング/.test(s)) return 'sparkling';
  if (/ロゼ/.test(s)) return 'rose';
  if (/オレンジ|橙/.test(s)) return 'orange';
  if (/白/.test(s)) return 'white';
  if (/赤/.test(s)) return 'red';
  return 'red';
}
async function journalDelete(id){

  if (!uid) return;

    const r = await authFetch(CELLAR_API_BASE+'/api/taste/list/'+encodeURIComponent(id)+'?userId='+encodeURIComponent(uid), { method:'DELETE' });
    if(!r.ok) throw 0;
    journal = journal.filter(j => String(j.id) !== String(id));
    renderJournal();
    renderStats();
    showToast(t('sb_deleted'));

}

// AG節: currentCellarId が設定されていればそのセラーだけに絞った配列を返す（すべての集計・一覧はこれを使う）
function cellarScoped(){
  if (currentCellarId === null) return cellar;
  return cellar.filter(w => w.cellarId === currentCellarId);
}
function cellarNameOf(id){
  const c = cellars.find(x => x.id === id);
  return c ? (c.emoji||'🍾') + ' ' + c.name : '';
}

function renderSummary() {
  const scoped = cellarScoped();
  // サーバー在庫（cellar_bottles）も本数・合計・平均に含める
  const sb = serverBottlesScoped();
  const total = scoped.reduce((s,w) => s + w.bottles, 0) + sb.reduce((s,b) => s + (b.bottles||0), 0);
  const totalSpend = scoped.reduce((s,w) => s + w.price, 0) + sb.reduce((s,b) => s + (b.price_jpy||0), 0);
  const kinds = scoped.length + sb.length;
  const cats = [...new Set([...scoped.map(w => w.cat), ...sb.map(b => b.cat).filter(Boolean)])].length;
  const avgPrice = kinds ? Math.round(totalSpend / kinds) : 0;
  // 参考価格の合計（依頼 A）。決まりはサーバーの services/cellarValue.js と同じ: サーバーが refPrice を
  // 付けた行（in_stock・catalog_id あり・年が一致）だけを 参考価格×本数 で足す。それ以外は「分からない」に
  // 本数で数え、0円として黙って足さない。楽天の実売は混ぜない（1本ごとの詳細にだけ出す）。
  let refTotal = 0, refKnown = 0, refUnknown = 0;
  sb.forEach(b => { const n = b.bottles||0; if (b.refPrice != null) { refTotal += b.refPrice * n; refKnown += n; } else refUnknown += n; });
  scoped.forEach(w => { refUnknown += (w.bottles||0); });   // 端末キャッシュの旧在庫はカタログと繋がっていない
  const vb = document.getElementById('valueBar');
  if (vb) {
    vb.style.display = (refKnown + refUnknown) ? 'block' : 'none';
    vb.innerHTML = `
      <div class="value-main"><span class="value-label">${t('value_label')}</span><span class="value-num">${refKnown ? '¥' + refTotal.toLocaleString() : '—'}</span></div>
      <div class="value-count">${t('value_counts', { k: refKnown, u: refUnknown })}</div>
      <div class="value-note">${t('value_note')}</div>`;
  }
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-item">
      <div class="summary-val">${total}</div>
      <div class="summary-label">${t('summary_total')}</div>
    </div>
    <div class="summary-item">
      <div class="summary-val">${kinds}</div>
      <div class="summary-label">${t('summary_wines')}</div>
    </div>
    <div class="summary-item">
      <div class="summary-val">${cats}</div>
      <div class="summary-label">${t('summary_cats')}</div>
    </div>
    <div class="summary-item">
      <div class="summary-val">${t('fmt_avg_price', { man: (avgPrice/10000).toFixed(1), yen: avgPrice.toLocaleString() })}</div>
      <div class="summary-label">${t('summary_avg')}</div>
    </div>`;
}

function renderCellar() {
  const scoped = cellarScoped();
  const catFiltered = currentCat === 'all' ? scoped : scoped.filter(w => w.cat === currentCat);
  const list = sortWines(catFiltered);
  const showBadge = currentCellarId === null && cellars.length > 1;
  const localCards = list.map(w => {
    const cfg = catCfg[w.cat];
    // idは必ず文字列として引用して渡す（uuid等の非数値idでonclickが壊れないように）。テキストはesc。
    return `
      <div class="cellar-card">
        <div class="cellar-card-inner" onclick="openDetail('${esc(String(w.id))}')">

            </div>

            ${showBadge && w.cellarId ? `<div class="cellar-badge">${esc(cellarNameOf(w.cellarId))}</div>` : ''}
            <div class="cellar-bottom">
              <div class="cellar-purchase">¥${(w.price||0).toLocaleString()}</div>
              <div class="cellar-stock">
                <button class="stock-minus" onclick="event.stopPropagation();changeStock('${esc(String(w.id))}',-1)">−</button>
                <div class="stock-badge">${t('fmt_stock', { n: w.bottles })}</div>
                <button class="stock-plus"  onclick="event.stopPropagation();changeStock('${esc(String(w.id))}',+1)">＋</button>
              </div>

  const serverCards = renderServerBottleCards();
  document.getElementById('cellarList').innerHTML = (localCards + serverCards) ||

function toggleJournalPairing(id) {
  const slot = document.getElementById('jp-slot-' + id);
  if (!slot) return;
  if (slot.firstChild) { slot.innerHTML = ''; return; } // 開いていたら閉じる
  const d = jpDict();
  const chips = d.verdicts.map(o =>
    `<div class="jp-chip${o.v === 'mariage' ? ' jp-chip--mariage' : ''}" data-v="${o.v}">${o.label}</div>`
  ).join('');
  slot.innerHTML = `<div class="jp-panel">
    <div class="jp-intro">${esc(d.intro)}</div>
    <input class="jp-dish" type="text" maxlength="60" placeholder="${esc(d.dishPh)}">
    <div class="jp-chips">${chips}</div></div>`;
  const item = journal.find(j => String(j.id) === String(id)) || {};
  slot.querySelectorAll('.jp-chip').forEach(el => {
    el.addEventListener('click', () => {
      const dish = (slot.querySelector('.jp-dish').value || '').trim();
      if (!dish) { showToast(d.needDish); slot.querySelector('.jp-dish').focus(); return; }
      submitJournalPairing(slot, item, el.dataset.v, dish);
    });
  });
}

async function submitJournalPairing(slot, item, verdict, dish) {
  const d = jpDict();
  slot.querySelectorAll('.jp-chip').forEach(el => {
    el.style.pointerEvents = 'none';
    el.style.opacity = '0.55';
    el.setAttribute('aria-disabled', 'true');
  });
  const body = {
    userId: myUid(),
    verdict,
    dish: dish.slice(0, 60),
    wineName: item.name ? String(item.name).slice(0, 200) : null,
    context: 'taste_memo',
  };
  try {
    const response = await authFetch(CELLAR_API_BASE + '/api/pairing-feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!response.ok) throw new Error('journal pairing-feedback failed: ' + response.status);
    slot.innerHTML = `<div class="jp-thanks">${esc(d.thanks[verdict] || '')}</div>`;
  } catch (e) {
    console.warn('journal pairing-feedback failed:', e);
    slot.innerHTML = `<div class="jp-thanks">${esc(d.saveFailed)} <button type="button" class="jp-chip">${esc(d.retry)}</button></div>`;
    const retry = slot.querySelector('.jp-chip');
    if (retry) retry.addEventListener('click', () => submitJournalPairing(slot, item, verdict, dish));
  }
}

function renderJournal() {
  const box = document.getElementById('journalList');
  if (!journalLoaded) {
    box.innerHTML = `<div style="text-align:center;padding:32px 16px;color:var(--text-sub);font-size:13px;">${t('journal_loading')}</div>`;
    return;
  }
  if (!journal.length) {
    box.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-sub);">
      <div style="font-size:36px;margin-bottom:12px;">🍷</div>
      <div style="font-size:13px;line-height:1.8;">${t('journal_empty')}</div></div>`;
    return;
  }
  // 日付（ts）でグルーピング。新しい順
  const grouped = {};
  journal.forEach(j => {
    const key = j.ts ? String(j.ts).split('T')[0] : '';
    (grouped[key] = grouped[key] || []).push(j);
  });
  let html = '';
  Object.keys(grouped).sort((a,b) => b.localeCompare(a)).forEach(date => {
    const d = new Date(date);
    const label = isNaN(d) ? '' : t('fmt_date_md', {
      m: d.getMonth()+1,
      d: d.getDate(),
      mon: t('months').split(',')[d.getMonth()],
      w: t('weekdays').split(',')[d.getDay()],
    });
    if (label) html += `<div class="journal-date-header">${label}</div>`;
    grouped[date].forEach(j => {
      const cfg = catCfg[journalCatOf(j.iro)];
      const region = [j.kuni, j.chiiki].filter(v => v && v !== '不明').join(' ');
      const thumb = j.imageUrl
        ? `<img src="${esc(j.imageUrl)}" alt="" loading="lazy" style="flex-shrink:0;width:44px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--border);">`
        : `<div class="journal-cat-dot" style="background:${cfg.bg}">${cfg.emoji}</div>`;
      html += `
        <div class="journal-card">
          <div class="journal-card-top">
            ${thumb}
            <div class="journal-card-info">
              <div class="journal-wine-name">${esc(j.name) || '—'}${j.vintage ? ' ' + esc(j.vintage) : ''}</div>
              <div class="journal-wine-sub">${esc([j.producer, region].filter(Boolean).join(' · '))}</div>
              ${j.source === 'cellar' ? `<div class="cellar-badge">${esc(t('journal_from_cellar'))}</div>` : ''}
            </div>
            <button onclick="journalDelete('${esc(String(j.id))}')" title="${esc(t('sb_delete'))}" style="flex-shrink:0;background:none;border:none;color:#bbb;font-size:15px;cursor:pointer;padding:4px 6px;">🗑</button>
          </div>
          ${j.note ? `<div class="journal-note">${esc(j.note)}</div>` : ''}
          <div class="jp-row"><button class="jp-btn" onclick="toggleJournalPairing('${esc(String(j.id))}')">🍽 ${esc(jpDict().recBtn)}</button></div>
          <div class="jp-slot" id="jp-slot-${esc(String(j.id))}"></div>
        </div>`;
    });
  });
  document.getElementById('journalList').innerHTML = html;
}

function renderStats() {
  const scoped = cellarScoped();
  const sb = serverBottlesScoped();   // スキャン追加のサーバー在庫も在庫系の集計に含める
  // cat breakdown（ローカル在庫＋サーバー在庫）
  const catBreak = document.getElementById('catBreakdown');
  catBreak.innerHTML = Object.entries(catCfg).map(([cat, cfg]) => {
    const total = scoped.filter(w => w.cat === cat).reduce((s,w) => s + w.bottles, 0)
                + sb.filter(b => b.cat === cat).reduce((s,b) => s + (b.bottles||0), 0);
    return `<div class="cat-item">
      <div class="cat-item-icon" style="background:${cfg.bg}">${cfg.emoji}</div>
      <div class="cat-item-count">${total}</div>
      <div class="cat-item-label">${t('catshort_' + cat)}</div>
    </div>`;
  }).join('');

  // region chart（飲んだワイン実データ: kuni+chiiki）。データが無ければ正直に空表示
  const regions = {};
  journal.forEach(j => {
    const r = [j.kuni, j.chiiki].filter(v => v && v !== '不明').join(' ');
    if (r) regions[r] = (regions[r]||0) + 1;
  });
  const topRegions = Object.entries(regions).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxR = topRegions[0]?.[1] || 1;
  document.getElementById('regionChart').innerHTML = topRegions.length ? topRegions.map(([r,c]) => `
    <div class="bar-row">
      <div class="bar-label">${esc(r)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${c/maxR*100}%;background:var(--burgundy)"></div></div>
      <div class="bar-count">${t('fmt_n_bottles', { n: c })}</div>
    </div>`).join('')
    : `<div style="font-size:12px;color:var(--text-sub);padding:6px 0;">${t('stats_no_data')}</div>`;

  // grape chart（'—'や空は集計から除外）
  const grapes = {};
  scoped.forEach(w => {
    String(w.grapes||'').split('/').forEach(g => {
      const gg = g.trim();
      if (gg && gg !== '—') grapes[gg] = (grapes[gg]||0) + 1;
    });
  });
  const topGrapes = Object.entries(grapes).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxG = topGrapes[0]?.[1] || 1;
  document.getElementById('grapeChart').innerHTML = topGrapes.length ? topGrapes.map(([g,c]) => `
    <div class="bar-row">
      <div class="bar-label">${esc(g)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${c/maxG*100}%;background:var(--gold)"></div></div>
      <div class="bar-count">${t('fmt_n_bottles', { n: c })}</div>
    </div>`).join('')
    : `<div style="font-size:12px;color:var(--text-sub);padding:6px 0;">${t('stats_no_data')}</div>`;

  // rating: 記録データ（taste_items）に評価が含まれないため、カードごと非表示（推測の分布を出さない）
  const ratingCard = document.getElementById('ratingChart').closest('.stat-card');
  if (ratingCard) ratingCard.style.display = 'none';

  // spending（ローカル在庫＋サーバー在庫）
  const totalSpend = scoped.reduce((s,w)=>s+w.price,0) + sb.reduce((s,b)=>s+(b.price_jpy||0),0);
  const thisYear = scoped.filter(w=>w.date.startsWith('2026')).reduce((s,w)=>s+w.price,0)
                 + sb.filter(b=>(b.purchase_date||'').startsWith('2026')).reduce((s,b)=>s+(b.price_jpy||0),0);
  document.getElementById('spendingBlock').innerHTML = `
    <div class="spending-row">
      <span class="spending-label">${t('spend_year')}</span>
      <span class="spending-val highlight">¥${thisYear.toLocaleString()}</span>
    </div>
    <div class="spending-row">
      <span class="spending-label">${t('spend_value')}</span>
      <span class="spending-val">¥${totalSpend.toLocaleString()}</span>
    </div>
    <div class="spending-row">
      <span class="spending-label">${t('spend_wines')}</span>
      <span class="spending-val">${t('fmt_n_kinds', { n: scoped.length + sb.length })}</span>
    </div>
    <div class="spending-row">
      <span class="spending-label">${t('spend_recorded')}</span>
      <span class="spending-val">${t('fmt_n_bottles', { n: journal.length })}</span>
    </div>`;
}

function changeStock(id, delta) {
  const w = cellar.find(x => String(x.id) === String(id));
  if (!w) return;
  const newVal = w.bottles + delta;
  if (newVal < 0) return;
  w.bottles = newVal;
  if (newVal === 0) {
    showToast(t('toast_last'));
    cellar = cellar.filter(x => String(x.id) !== String(id));
  } else {
    showToast(delta > 0 ? t('toast_plus1') : t('toast_minus1'));
  }
  saveCellar();
  syncWineToServer(w);
  renderSummary();
  renderCellar();
}

// 失敗時は入力を保持してエラー表示（モーダルは閉じない）。
let saveWineInflight = false;
async function saveWine() {
  if (saveWineInflight) return;
  const name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }
  const uid = myUid();
  const cellarSel = document.getElementById('f-cellar');
  const cellarId = (cellarSel && cellarSel.value) || currentCellarId || (cellars[0] && cellars[0].id) || null;
  if (!uid || !cellarId) { showToast(t('toast_add_fail')); return; }
  if(window.sommLog) sommLog('cellar_add');
  // cellar_bottlesにgrapes列が無いため、品種はnoteに合流させて保全する
  const grapes = document.getElementById('f-grapes').value.trim();
  const noteRaw = document.getElementById('f-note').value.trim();
  const note = [noteRaw, grapes ? (LANG === 'en' ? 'Grapes: ' : '品種: ') + grapes : ''].filter(Boolean).join(' / ');
  saveWineInflight = true;
  const btn = document.querySelector('#addModal .save-btn');
  if (btn) { btn.disabled = true; btn.style.opacity = '.55'; }
  try {
    const r = await authFetch(CELLAR_API_BASE + '/api/cellar/bottles', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: uid, cellarId,
        name,
        producer: document.getElementById('f-producer').value.trim() || null,
        vintage:  document.getElementById('f-vintage').value.trim()  || null,
        region:   document.getElementById('f-region').value.trim()   || null,
        cat: selectedCatForAdd,
        bottles: parseInt(document.getElementById('f-bottles').value) || 1,
        price: document.getElementById('f-price').value !== '' ? (parseInt(document.getElementById('f-price').value) || 0) : null,
        purchaseDate: document.getElementById('f-date').value || null,
        note: note || null,
        ...readProvenance('f'),
      }),
    });
    if (!r.ok) throw 0;
    // reset form
    ['f-name','f-producer','f-vintage','f-region','f-grapes','f-note','f-acq-how','f-acq-shop','f-acq-from'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    document.getElementById('f-bottles').value = '1';
    document.getElementById('f-price').value = '';
    closeAddModal();
    await loadServerBottles();   // 再読込（renderSummary/renderCellarも走る）
    showToast(t('toast_added'));
  } catch (e) {
    showToast(t('toast_add_fail'));   // 入力は保持したまま
  } finally {
    saveWineInflight = false;
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
  }
}

// セラーを写真で管理する（2026-10-26・アプリ5への依頼 A〜E。DDL No.37）
//   A 参考価格（サーバーが行ごとに refPrice・refPriceOtherYear・marketPrice を付けて返す）
//   B 飲んだら写真で外す（identify-shelf → 在庫の候補 → 本人が1タップで確かめてから consume）
//   C 写真からまとめて追加（identify-shelf を1枚ずつ → 一覧で確認 → /api/cellar/bottles/bulk）
//   D ワインリストとして見せる（/api/cellars/:id/share → prototype.html?cl=<token>）
//   E 来歴（どこで買った・誰からもらった）とおくりもの（贈る・受け取りリンク・取り消し・履歴）
// ═══════════════════════════════════════════════════════════
const yen = n => '¥' + Number(n).toLocaleString();
function fmtYearMonth(d){
  const m = String(d || '').match(/^(\d{4})-(\d{2})/);
  return m ? t('fmt_ym', { y: m[1], m: Number(m[2]) }) : '';
}
// カードの来歴1行: 「🎁 〇〇さんから・2025年12月」「🛒 〇〇で購入・2026年3月」
function provenanceText(b){
  const ym = fmtYearMonth(b.purchase_date);
  const tail = ym ? '・' + ym : '';
  if (b.acquired_how === 'gift') return '🎁 ' + (b.acquired_from_name ? t('prov_from', { name: b.acquired_from_name }) : t('prov_gift')) + tail;
  if (b.acquired_shop) return '🛒 ' + t('prov_shop', { shop: b.acquired_shop }) + tail;
  if (b.acquired_how === 'bought') return '🛒 ' + t('prov_bought') + tail;
  return '';
}
function refPriceText(b){
  if (b.refPrice != null) return t('ref_price', { p: yen(b.refPrice) });
  if (b.refPriceOtherYear) return t('ref_price_other', { p: yen(b.refPriceOtherYear.price), v: b.refPriceOtherYear.vintage || '—' });
  return t('ref_price_unknown');
}

function provenanceFieldsHtml(p, v, withDate){

function fileToDataUrl(f, maxEdge){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, (maxEdge || 1568) / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); resolve(null); };
    img.src = URL.createObjectURL(f);
  });
}
// 写真からそのボトル1本を切り抜く（restaurant_admin.html の cropShotToBox と同じ上下左右10%の余白）
function cropToBox(dataUrl, box, maxEdge){
  return new Promise(resolve => {
    if (!dataUrl || !box || typeof box.cx !== 'number') { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const padW = (box.w || 0.1) * 0.10, padH = (box.h || 0.3) * 0.10;
        const pw = Math.min(1, (box.w || 0.1) + padW * 2), ph = Math.min(1, (box.h || 0.3) + padH * 2);
        const cw = Math.max(1, Math.round(pw * iw)), ch = Math.max(1, Math.round(ph * ih));
        const left = Math.min(iw - cw, Math.max(0, Math.round((box.cx - pw / 2) * iw)));
        const top = Math.min(ih - ch, Math.max(0, Math.round((box.cy - ph / 2) * ih)));
        const sc = Math.min(1, (maxEdge || 800) / Math.max(cw, ch));
        const c = document.createElement('canvas');
        c.width = Math.round(cw * sc); c.height = Math.round(ch * sc);
        c.getContext('2d').drawImage(img, left, top, cw, ch, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82));
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}
async function readShelfPhoto(dataUrl){
  const r = await authFetch(CELLAR_API_BASE + '/api/identify-shelf', {

  const d = await r.json();
  return Array.isArray(d.bottles) ? d.bottles : [];
}
// 色 → セラーのカテゴリ（scouter.html cellarCatFromColor と同じ）
function catFromColor(c){
  const s = String(c || '').toLowerCase();
  if (/泡|スパークリング|sparkl|spumante|cava|champagne|シャンパ/.test(s)) return 'sparkling';
  if (/ロゼ|ros[eé]/.test(s)) return 'rose';
  if (/オレンジ|橙|amber|orange/.test(s)) return 'orange';
  if (/白|white|blanc|bianco/.test(s)) return 'white';
  if (/赤|red|rouge|rosso/.test(s)) return 'red';
  return null;
}
// スキャン1本 → 在庫に入れる形。年はラベルから読めた値を先に使う（照合先のカタログ行は別の年のことがある）
function shelfWine(b){
  const w = b.match && b.match.wine; const idn = b.identification || {};
  const vt = idn.vintage != null && idn.vintage !== '' ? idn.vintage : (w && w.vintage);
  return {
    catalogId: (w && (w.catalogId || w.catalog_id)) || null,
    name: (w && w.name) || idn.wine || '',
    producer: (w && w.producer) || idn.producer || '',
    vintage: vt != null ? String(vt) : '',
    region: w ? [w.kuni, w.chiiki].filter(v => v && v !== '不明').join(' ') : [idn.country, idn.region].filter(Boolean).join(' '),
    cat: catFromColor(w ? (w.iro || w.color) : idn.color),
  };
}

// ── B. 飲んだら写真で外す ──
function normName(s){ return String(s || '').normalize('NFKC').toLowerCase().replace(/[\s・·\-‐–—'’"“”.,()（）「」]/g, ''); }
function nameSim(a, b){
  a = normName(a); b = normName(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const grams = s => { const g = []; for (let i = 0; i < s.length - 1; i++) g.push(s.slice(i, i + 2)); return g; };
  const A = grams(a), B = grams(b);
  if (!A.length || !B.length) return 0;
  const m = new Map(); A.forEach(x => m.set(x, (m.get(x) || 0) + 1));
  let hit = 0; B.forEach(x => { const c = m.get(x) || 0; if (c > 0) { hit++; m.set(x, c - 1); } });
  return 2 * hit / (A.length + B.length);
}
function sameYear(a, b){
  const ya = String(a || '').match(/(19|20)\d{2}/), yb = String(b || '').match(/(19|20)\d{2}/);
  if (ya && yb) return ya[0] === yb[0];
  return /^nv/i.test(String(a || '').trim()) && /^nv/i.test(String(b || '').trim());
}
// 写ったワインに当たる在庫の候補: 同じ catalog_id → 無ければ名前の近さ（catalog_id が無い行・読めたワインに無いとき）
function drinkCandidates(info){
  const stock = serverBottlesScoped();
  const out = [];
  if (info.catalogId) stock.filter(b => b.catalog_id === info.catalogId)
    .forEach(b => out.push({ b, how: 'catalog', score: 2 + (sameYear(b.vintage, info.vintage) ? 0.5 : 0) }));
  const key = [info.producer, info.name].filter(Boolean).join(' ');
  stock.forEach(b => {
    if (out.some(o => o.b.id === b.id)) return;
    if (info.catalogId && b.catalog_id) return;   // どちらもカタログに繋がっていて違う＝別のワイン
    const sim = nameSim(key, [b.producer, b.name].filter(Boolean).join(' '));
    if (sim >= 0.5) out.push({ b, how: 'name', score: sim + (sameYear(b.vintage, info.vintage) ? 0.2 : 0) });
  });
  return out.sort((x, y) => y.score - x.score).slice(0, 4);
}

    const rows = []; let failed = 0, limitMsg = null;
    for (let i = 0; i < take.length; i++) {

      try {
        const bottles = await readShelfPhoto(dataUrl);
        if (!bottles.length) { failed++; continue; }

          const w = shelfWine(b);
          if (!w.name) { failed++; continue; }   // 位置だけ分かって銘柄が読めない＝偽の行を作らない
          w.bottles = 1; w.checked = true;

          rows.push(w);
        }
      } catch (e) {
        if (e.limit) { limitMsg = e.limit; break; }   // 残りを送っても弾かれるだけ。読めた分だけ見せる
        failed++;
      }
    }
    if (seq !== sheetSeq) return;
    // 同じ写真・別の写真に同じワインが写っていたら1行にまとめて本数を足す（本数は一覧で直せる）
    const byKey = new Map(); bulkRows = [];
    rows.forEach(r => {
      const k = (r.catalogId || normName(r.producer + ' ' + r.name)) + '|' + normName(r.vintage);
      const hit = byKey.get(k);

    if (!bulkRows.length) { setSheetBody(`<div class="sheet-sub">${esc(limitMsg || t('scan_none'))}</div>`, seq); return; }
    await ensureCellar();

        body: JSON.stringify({ userId: uid, cellarId, items: chunk.map(w => ({
          catalogId: w.catalogId, name: w.name, producer: w.producer || null, vintage: w.vintage || null,
          region: w.region || null, cat: w.cat || null, bottles: w.bottles, photo: w.photo || null, ...prov,
        })) }),
      });
      if (!r.ok) throw new Error('bulk ' + r.status);
      chunk.forEach(w => { w.checked = false; w.added = true; });   // 入った分は送り直さない
      added += chunk.length;
    }
  } catch (e) {
    bulkAdding = false;
    bulkRows = bulkRows.filter(w => !w.added);
    showToast(added ? t('bulk_partial') : t('toast_add_fail'));
    if (added) { renderBulkSheet(0, null); loadServerBottles(); } else updateBulkBtn();
    return;
  }
  bulkAdding = false;
  bulkRows = [];
  closeSheetModal();
  await loadServerBottles();
  showToast(t('bulk_added', { n: added }));
}

// ── E-2. 贈る ──
function giftUrl(token){ return new URL('gift.html?t=' + encodeURIComponent(token), location.href).href; }
function openGiveSheet(id){
  const b = serverBottles.find(x => String(x.id) === String(id));
  if (!b) return;
  closeDetail();
  let nick = ''; try { nick = localStorage.getItem('sommelin_nickname') || ''; } catch (e) {}
  openSheet(t('give_title'), `
    <div class="sheet-sub" style="margin-bottom:12px;"><b>${esc(b.name || '')} ${esc(b.vintage || '')}</b><br>${esc(t('give_lead'))}</div>
    <div class="field-label">${esc(t('field_give_to'))}</div>
    <input class="field-input" id="gv-to" maxlength="60" placeholder="${esc(t('ph_give_to'))}">
    <div class="field-label">${esc(t('field_give_from'))}</div>
    <input class="field-input" id="gv-from" maxlength="60" value="${esc(nick)}" placeholder="${esc(t('ph_give_from'))}">
    <div class="field-label">${esc(t('field_give_msg'))}</div>
    <textarea class="field-input" id="gv-msg" maxlength="500" rows="3" placeholder="${esc(t('ph_give_msg'))}"></textarea>
    <label style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:700;margin-bottom:16px;line-height:1.5;">
      <input type="checkbox" id="gv-link" checked style="margin-top:3px;accent-color:var(--burgundy);">
      <span>${esc(t('give_with_link'))}<br><span class="sheet-sub" style="font-weight:500;">${esc(t('give_with_link_sub'))}</span></span>
    </label>
    <button class="save-btn" id="gv-save" onclick="submitGive('${esc(String(b.id))}')">${esc(t('give_btn'))}</button>`);
}
let giveInflight = false;
async function submitGive(id){
  if (giveInflight) return;
  const uid = myUid();
  const b = serverBottles.find(x => String(x.id) === String(id));
  if (!uid || !b) return;
  const withLink = !!(document.getElementById('gv-link') || {}).checked;
  const fromName = inputVal('gv-from');
  giveInflight = true;
  const btn = document.getElementById('gv-save');
  if (btn) { btn.disabled = true; btn.style.opacity = '.55'; }
  try {
    const r = await authFetch(CELLAR_API_BASE + '/api/cellar/bottles/' + encodeURIComponent(id) + '/give', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: uid, toName: inputVal('gv-to') || null, fromName: fromName || null, message: inputVal('gv-msg') || null, withLink }),
    });
    if (!r.ok) throw new Error('give ' + r.status);
    const d = await r.json();
    giftsLoaded = false;
    loadServerBottles();
    if (d.claimToken) {
      const url = giftUrl(d.claimToken);
      const lineText = t('give_line_text', { from: fromName || t('give_someone'), wine: [b.name, b.vintage].filter(Boolean).join(' ') });
      setSheetBody(`<div class="sheet-sub" style="margin-bottom:10px;">${esc(t('give_link_ready'))}</div>${shareLinkHtml(url, lineText)}`);
    } else {
      closeSheetModal();
      showToast(t('give_recorded'));
    }
  } catch (e) {
    showToast(t('gift_fail'));
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
  } finally { giveInflight = false; }
}

// ── E-2. おくりものの履歴（贈った・もらった。見えるのは当事者だけ） ──
let gifts = { sent: [], received: [] }, giftsLoaded = false;
async function loadGifts(){
  const uid = myUid();
  const box = document.getElementById('giftList');
  if (!uid || !box) return;
  if (!giftsLoaded) box.innerHTML = `<div style="text-align:center;padding:32px 16px;color:var(--text-sub);font-size:13px;">${esc(t('journal_loading'))}</div>`;
  try {
    const r = await authFetch(CELLAR_API_BASE + '/api/gifts?userId=' + encodeURIComponent(uid));
    if (r.ok) { const d = await r.json(); gifts = { sent: d.sent || [], received: d.received || [] }; }
  } catch (e) {}
  giftsLoaded = true;
  renderGifts();
}
function renderGifts(){
  const box = document.getElementById('giftList');
  if (!box) return;
  if (!gifts.sent.length && !gifts.received.length) {
    box.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-sub);"><div style="font-size:36px;margin-bottom:12px;">🎁</div><div style="font-size:13px;line-height:1.8;">${t('gifts_empty')}</div></div>`;
    return;
  }
  const day = iso => (iso ? String(iso).split('T')[0] : '');
  const wine = g => esc([g.name, g.vintage].filter(Boolean).join(' '));
  let html = '';
  if (gifts.received.length) {
    html += `<div class="journal-date-header">${esc(t('gifts_received'))}</div>`;
    html += gifts.received.map(g => `
      <div class="gift-card">
        <div class="gift-head"><div class="gift-who">🎁 ${esc(t('gift_from', { name: g.fromName || t('gift_noname') }))}</div><span class="sheet-sub">${esc(day(g.acceptedAt || g.sentAt))}</span></div>
        <div style="font-size:12.5px;margin-top:4px;">${wine(g)}</div>
        ${g.message ? `<div class="journal-note" style="margin-top:6px;">${esc(g.message)}</div>` : ''}
      </div>`).join('');
  }
  if (gifts.sent.length) {
    html += `<div class="journal-date-header">${esc(t('gifts_sent'))}</div>`;
    html += gifts.sent.map(g => `
      <div class="gift-card">
        <div class="gift-head"><div class="gift-who">${esc(t('gift_to', { name: g.toName || t('gift_noname') }))}</div><span class="gift-status ${esc(g.status)}">${esc(t('gift_st_' + g.status))}</span></div>
        <div style="font-size:12.5px;margin-top:4px;">${wine(g)}</div>
        <div class="sheet-sub">${esc(day(g.sentAt))}${g.acceptedAt ? ' → ' + esc(day(g.acceptedAt)) : ''}</div>
        ${g.status === 'sent' && g.claimToken ? `<div style="display:flex;gap:8px;margin-top:8px;">
          <button class="sheet-btn" style="flex:1;" data-url="${esc(giftUrl(g.claimToken))}" onclick="copyText(this.dataset.url)">${esc(t('copy_link'))}</button>
          <button class="sheet-btn" style="flex:1;border-color:var(--border);color:#b03a3a;" onclick="cancelGift('${esc(String(g.id))}')">${esc(t('gift_cancel'))}</button>
        </div>` : ''}
      </div>`).join('');
  }
  box.innerHTML = html;
}
async function cancelGift(id){
  const uid = myUid();
  if (!uid || !confirm(t('gift_cancel_confirm'))) return;
  try {
    const r = await authFetch(CELLAR_API_BASE + '/api/gifts/' + encodeURIComponent(id) + '/cancel', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: uid }),
    });
    if (r.status === 409) { showToast(t('gift_not_cancellable')); }
    else if (!r.ok) throw new Error('cancel ' + r.status);
    else { const d = await r.json(); showToast(d.restored ? t('gift_cancelled') : t('gift_cancelled_norestore')); }
  } catch (e) { showToast(t('gift_fail')); }
  giftsLoaded = false;
  loadGifts();
  loadServerBottles();
}

let openShareId = null;
function cellarListUrl(token){ return new URL('prototype.html?cl=' + encodeURIComponent(token), location.href).href; }
function toggleSharePanel(id){ openShareId = openShareId === id ? null : id; renderCellarManageList(); }
function sharePanelHtml(c){
  if (!c.share_token) {
    return `<div class="share-box"><div class="sheet-sub" style="margin-bottom:8px;">${esc(t('share_lead'))}</div>
      <button class="sheet-btn" onclick="setShare('${c.id}','on')">${esc(t('share_on'))}</button></div>`;
  }
  const url = cellarListUrl(c.share_token);
  return `<div class="share-box">
    <div style="font-size:12px;font-weight:800;margin-bottom:6px;">🔗 ${esc(t('share_is_on'))}</div>
    ${shareLinkHtml(url, t('share_line_text', { name: c.name }))}
    <div class="sheet-sub" style="margin:8px 0;">${esc(t('share_hidden_note'))}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="cellar-manage-btn" onclick="showShareQr('${c.id}')">${esc(t('share_qr'))}</button>
      <button class="cellar-manage-btn" onclick="setShare('${c.id}','regenerate')">${esc(t('share_regen'))}</button>
      <button class="cellar-manage-btn danger" onclick="setShare('${c.id}','off')">${esc(t('share_off'))}</button>
    </div>
    <div id="qr-${c.id}" style="margin-top:10px;display:flex;justify-content:center;"></div>
  </div>`;
}
async function setShare(id, action){
  const uid = myUid();
  if (!uid) return;
  if (action === 'regenerate' && !confirm(t('share_regen_confirm'))) return;
  if (action === 'off' && !confirm(t('share_off_confirm'))) return;
  try {
    const r = await authFetch(CELLAR_API_BASE + '/api/cellars/' + encodeURIComponent(id) + '/share', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: uid, action }),
    });
    if (!r.ok) throw new Error('share ' + r.status);
    const d = await r.json();
    const c = cellars.find(x => x.id === id);
    if (c) c.share_token = d.shareToken || null;
    openShareId = id;
    renderCellarManageList();
    showToast(t(action === 'off' ? 'share_turned_off' : action === 'regenerate' ? 'share_regenerated' : 'share_turned_on'));
  } catch (e) { showToast(t('share_fail')); }
}
let qrLibPromise = null;
function loadQrLib(){
  if (window.QRCode) return Promise.resolve();
  if (!qrLibPromise) qrLibPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';   // restaurant_admin.html と同じ
    sc.onload = resolve;
    sc.onerror = () => { qrLibPromise = null; reject(new Error('qr lib')); };
    document.head.appendChild(sc);
  });
  return qrLibPromise;
}
function showShareQr(id){
  const c = cellars.find(x => x.id === id);
  const box = document.getElementById('qr-' + id);
  if (!c || !c.share_token || !box) return;
  loadQrLib().then(() => {
    box.innerHTML = '';
    new QRCode(box, { text: cellarListUrl(c.share_token), width: 180, height: 180 });
  }).catch(() => showToast(t('share_qr_fail')));
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
