<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sommelin — マイセラー</title>
<meta name="robots" content="noindex">
<style>
:root {
  --burgundy: #9B1B4B;
  --wine-dark: #5C0E2A;
  --burgundy-pale: #f9f0f3;
  --gold: #C9973A;
  --gold-light: #fdf6e8;
  --line: #06C755;
  --text: #2C1A1D;
  --text-sub: #7A5A62;
  --border: #ecdde2;
  --bg: #F5F3F0;
  --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ── HEADER ── */
.header {
  background: var(--wine-dark);
  padding: 18px 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-back {
  background: none; border: none; color: rgba(255,255,255,0.7);
  font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1;
}
.header-title { font-size: 16px; font-weight: 800; color: white; }
.header-sub { font-size: 11px; color: rgba(255,255,255,0.55); font-weight: 500; margin-top: 1px; }
.header-add {
  width: 34px; height: 34px; background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; color: white;
  font-weight: 300; line-height: 1;
}

/* ── TABS ── */
.tabs {
  background: white;
  display: flex;
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  flex: 1; padding: 13px 0; text-align: center;
  font-size: 12px; font-weight: 700; color: var(--text-sub);
  border: none; background: none; cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: color 0.15s;
}
.tab-btn.active { color: var(--burgundy); border-bottom-color: var(--burgundy); }

/* ── PANELS ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── CELLAR SUMMARY ── */
.summary-row {
  background: white;
  padding: 18px 20px;
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.summary-row::-webkit-scrollbar { display: none; }
.summary-item {
  flex: 1; min-width: 70px; text-align: center;
  padding: 0 8px;
  border-right: 1px solid var(--border);
}
.summary-item:last-child { border-right: none; }
.summary-val {
  font-size: 22px; font-weight: 900; color: var(--burgundy); line-height: 1;
  margin-bottom: 3px;
}
.summary-label { font-size: 10px; color: var(--text-sub); font-weight: 600; }
.summary-sub { font-size: 9px; color: var(--text-sub); margin-top: 2px; }

/* ── CELLAR FILTERS ── */
.filter-row {
  padding: 14px 16px 10px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--border); background: white; color: var(--text-sub);
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: all 0.15s;
}
.filter-chip.active {
  background: var(--wine-dark); border-color: var(--wine-dark); color: white;
}

/* ── WINE CARDS ── */
.wine-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

.cellar-card {
  background: white; border-radius: 16px; border: 1px solid var(--border);
  overflow: hidden; cursor: pointer;
  transition: transform 0.15s;
}
.cellar-card:active { transform: scale(0.985); }
.cellar-card-inner { display: flex; gap: 0; }
.cellar-card-label {
  width: 58px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  background: var(--burgundy-pale);
  position: relative;
}
.cellar-card-label.photo {
  background: linear-gradient(160deg,#2C1A1D,#5C0E2A);
}
.cellar-card-label.photo span { opacity: 0.3; font-size: 20px; }
.cellar-card-body { flex: 1; padding: 13px 14px 11px; }
.cellar-card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 6px; margin-bottom: 2px;
}
.cellar-name { font-size: 13px; font-weight: 800; color: var(--text); line-height: 1.3; flex: 1; }
.cellar-vintage {
  font-size: 11px; font-weight: 700;
  color: var(--burgundy); background: var(--burgundy-pale);
  border-radius: 8px; padding: 2px 7px; white-space: nowrap; flex-shrink: 0;
}
.cellar-producer { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
.cellar-region { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }
.cellar-bottom { display: flex; align-items: center; gap: 8px; }
.cellar-purchase {
  font-size: 11px; color: var(--text-sub); flex: 1;
  display: flex; align-items: center; gap: 4px;
}
.cellar-stock {
  display: flex; align-items: center; gap: 6px;
}
.stock-badge {
  background: var(--gold-light); border: 1px solid #e8d090;
  border-radius: 12px; padding: 4px 10px;
  font-size: 12px; font-weight: 800; color: var(--gold);
  display: flex; align-items: center; gap: 4px;
}
.stock-minus, .stock-plus {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; cursor: pointer; border: none;
  flex-shrink: 0;
}
.stock-minus { background: var(--burgundy-pale); color: var(--burgundy); }
.stock-plus  { background: var(--gold-light); color: var(--gold); }
.stock-minus:active, .stock-plus:active { opacity: 0.7; }

/* ── JOURNAL ── */
.journal-list { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.journal-date-header {
  font-size: 11px; font-weight: 800; color: var(--text-sub);
  letter-spacing: 0.5px; padding: 4px 0 2px;
  display: flex; align-items: center; gap: 8px;
}
.journal-date-header::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.journal-card {
  background: white; border-radius: 16px; border: 1px solid var(--border);
  padding: 14px; cursor: pointer;
  transition: transform 0.15s;
}
.journal-card:active { transform: scale(0.985); }
.journal-card-top {
  display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px;
}
.journal-cat-dot {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.journal-card-info { flex: 1; }
.journal-wine-name { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
.journal-wine-sub { font-size: 11px; color: var(--text-sub); }
.journal-stars { display: flex; gap: 2px; }
.star { font-size: 14px; }
.journal-note {
  font-size: 12px; color: var(--text-sub); line-height: 1.6;
  border-top: 1px solid var(--bg); padding-top: 8px;
}
.journal-place {
  font-size: 11px; color: var(--text-sub);
  display: flex; align-items: center; gap: 4px;
  margin-top: 6px;
}

/* ── STATS ── */
.stats-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.stat-card {
  background: white; border-radius: 16px; border: 1px solid var(--border);
  overflow: hidden;
}
.stat-card-title {
  font-size: 13px; font-weight: 800; color: var(--text);
  padding: 14px 16px 0;
}
.stat-chart { padding: 14px 16px; }

/* bar chart */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-label { font-size: 11px; color: var(--text-sub); width: 80px; flex-shrink: 0; }
.bar-track { flex: 1; height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; transition: width 0.6s ease; }
.bar-count { font-size: 11px; font-weight: 700; color: var(--text); width: 30px; text-align: right; flex-shrink: 0; }

/* cat breakdown */
.cat-breakdown { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 14px 16px; }
.cat-item { text-align: center; }
.cat-item-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin: 0 auto 5px;
}
.cat-item-count { font-size: 15px; font-weight: 900; color: var(--text); }
.cat-item-label { font-size: 9px; color: var(--text-sub); font-weight: 600; }

/* rating chart */
.rating-chart { padding: 14px 16px; }
.rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rating-stars { font-size: 11px; white-space: nowrap; width: 60px; }
.rating-bar-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.rating-bar-fill { height: 100%; border-radius: 4px; background: var(--gold); }
.rating-count { font-size: 11px; color: var(--text-sub); width: 20px; text-align: right; }

/* spending */
.spending-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--bg);
  font-size: 13px;
}
.spending-row:last-child { border-bottom: none; }
.spending-label { color: var(--text-sub); font-weight: 600; }
.spending-val { font-weight: 800; color: var(--text); }
.spending-val.highlight { color: var(--burgundy); font-size: 15px; }

/* ── ADD MODAL ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  z-index: 200; display: none; align-items: flex-end;
}
.modal-bg.open { display: flex; }
.modal {
  background: white; border-radius: 24px 24px 0 0;
  width: 100%; max-width: 430px; margin: 0 auto;
  padding: 0 0 44px; max-height: 92vh;
  overflow-y: auto; animation: slideUp 0.28s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.modal-handle {
  width: 36px; height: 4px; background: #ddd;
  border-radius: 2px; margin: 12px auto 0;
}
.modal-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h3 { font-size: 16px; font-weight: 900; color: var(--text); }
.modal-close-btn {
  width: 28px; height: 28px; background: var(--bg); border: none;
  border-radius: 50%; font-size: 14px; cursor: pointer; color: var(--text-sub);
  display: flex; align-items: center; justify-content: center;
}
.modal-body-pad { padding: 20px; }
.field-label {
  font-size: 11px; font-weight: 800; color: var(--text-sub);
  letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px;
}
.field-input {
  width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 11px 14px; font-size: 14px; color: var(--text);
  background: white; outline: none; margin-bottom: 16px;
  font-family: inherit;
}
.field-input:focus { border-color: var(--burgundy); }
.cat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.cat-chip {
  padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--border); background: white; color: var(--text-sub);
  cursor: pointer; transition: all 0.15s;
}
.cat-chip.active { background: var(--wine-dark); border-color: var(--wine-dark); color: white; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.camera-area {
  border: 2px dashed var(--border); border-radius: 16px;
  padding: 28px; text-align: center; cursor: pointer;
  margin-bottom: 16px; background: var(--bg);
  transition: all 0.15s;
}
.camera-area:active { background: var(--burgundy-pale); border-color: var(--burgundy); }
.camera-area .icon { font-size: 32px; margin-bottom: 8px; }
.camera-area .label { font-size: 13px; font-weight: 700; color: var(--text-sub); }
.camera-area .sub { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
.save-btn {
  width: 100%; background: var(--burgundy); color: white;
  border: none; border-radius: 14px; padding: 16px;
  font-size: 15px; font-weight: 800; cursor: pointer;
  margin-top: 4px;
}
.save-btn:active { opacity: 0.85; }

/* ── DETAIL MODAL ── */
.detail-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.detail-section:last-child { border-bottom: none; }
.detail-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--bg); font-size: 13px;
}
.detail-row:last-child { border-bottom: none; }
.detail-label { color: var(--text-sub); font-weight: 600; }
.detail-val { color: var(--text); font-weight: 700; }
.drink-btn {
  width: 100%; background: var(--wine-dark); color: white;
  border: none; border-radius: 14px; padding: 15px;
  font-size: 14px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.drink-btn:active { opacity: 0.85; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: white; border-top: 1px solid var(--border);
  display: flex; padding: 8px 0 16px; z-index: 40;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px; cursor: pointer;
  background: none; border: none; padding: 4px 0;
  text-decoration: none;
}
.nav-btn .icon { font-size: 20px; }
.nav-btn .label { font-size: 10px; color: var(--text-sub); font-weight: 700; }
.nav-btn.active .label { color: var(--burgundy); }
.nav-btn.active .icon { filter: none; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--wine-dark); color: white; border-radius: 20px;
  padding: 10px 20px; font-size: 13px; font-weight: 700;
  z-index: 300; opacity: 0; transition: opacity 0.25s;
  pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <button class="header-back" onclick="location.href='prototype.html'">‹</button>
    <div>
      <div class="header-title" data-i18n="header_title">マイセラー</div>
      <div class="header-sub" id="cellarHeaderName" data-i18n="header_guest">ゲスト</div>
    </div>
  </div>
  <div class="header-add" onclick="openAddModal()">＋</div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" id="tab-cellar"  onclick="switchTab('cellar')" data-i18n="tab_cellar">🍾 セラー</button>
  <button class="tab-btn"        id="tab-journal" onclick="switchTab('journal')" data-i18n="tab_journal">📖 記録</button>
  <button class="tab-btn"        id="tab-stats"   onclick="switchTab('stats')" data-i18n="tab_stats">📊 レポート</button>
</div>

<!-- ===== CELLAR PANEL ===== -->
<div class="panel active" id="panel-cellar">
  <!-- Summary -->
  <div class="summary-row" id="summaryRow"></div>
  <!-- Filters -->
  <div class="filter-row">
    <div class="filter-chip active" onclick="filterCat('all',this)" data-i18n="filter_all">すべて</div>
    <div class="filter-chip" onclick="filterCat('sparkling',this)" data-i18n="cat_chip_sparkling">🥂 泡</div>
    <div class="filter-chip" onclick="filterCat('white',this)" data-i18n="cat_chip_white">🍾 白</div>
    <div class="filter-chip" onclick="filterCat('red',this)" data-i18n="cat_chip_red">🍷 赤</div>
    <div class="filter-chip" onclick="filterCat('rose',this)" data-i18n="cat_chip_rose">🌸 ロゼ</div>
    <div class="filter-chip" onclick="filterCat('orange',this)" data-i18n="cat_chip_orange">🟠 橙</div>
  </div>
  <div class="wine-list" id="cellarList"></div>
</div>

<!-- ===== JOURNAL PANEL ===== -->
<div class="panel" id="panel-journal">
  <div class="journal-list" id="journalList"></div>
</div>

<!-- ===== STATS PANEL ===== -->
<div class="panel" id="panel-stats">
  <div class="stats-body">

    <!-- カテゴリ内訳 -->
    <div class="stat-card">
      <div class="stat-card-title" data-i18n="stat_cat_breakdown">カテゴリ内訳</div>
      <div class="cat-breakdown" id="catBreakdown"></div>
    </div>

    <!-- 産地ランキング -->
    <div class="stat-card">
      <div class="stat-card-title" data-i18n="stat_region_top5">よく飲む産地 TOP5</div>
      <div class="stat-chart" id="regionChart"></div>
    </div>

    <!-- 品種ランキング -->
    <div class="stat-card">
      <div class="stat-card-title" data-i18n="stat_grape_top5">よく飲む品種 TOP5</div>
      <div class="stat-chart" id="grapeChart"></div>
    </div>

    <!-- 評価分布 -->
    <div class="stat-card">
      <div class="stat-card-title" data-i18n="stat_rating_dist">評価の分布</div>
      <div class="rating-chart" id="ratingChart"></div>
    </div>

    <!-- 購入記録 -->
    <div class="stat-card">
      <div class="stat-card-title" data-i18n="stat_purchase_summary">購入サマリー</div>
      <div id="spendingBlock"></div>
    </div>

  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="prototype.html" class="nav-btn"><span class="icon">🏠</span><span class="label" data-i18n="nav_home">ホーム</span></a>
  <a href="wine_search.html" class="nav-btn"><span class="icon">🔍</span><span class="label" data-i18n="nav_search">検索</span></a>
  <button class="nav-btn active" onclick=""><span class="icon">🏺</span><span class="label" data-i18n="nav_cellar">セラー</span></button>
  <a href="prototype.html" class="nav-btn"><span class="icon">👤</span><span class="label" data-i18n="nav_mypage">マイページ</span></a>
</nav>

<!-- ===== ADD MODAL ===== -->
<div class="modal-bg" id="addModalBg" onclick="closeAddModal(event)">
  <div class="modal" id="addModal">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <h3 data-i18n="add_title">ワインを追加</h3>
      <button class="modal-close-btn" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body-pad">
      <!-- Camera -->
      <div class="camera-area" onclick="simulateScan()">
        <div class="icon">📷</div>
        <div class="label" data-i18n="scan_label">ラベルをスキャン</div>
        <div class="sub" data-i18n="scan_sub">カメラでボトルを撮影して自動入力</div>
      </div>
      <!-- Category -->
      <div class="field-label" data-i18n="field_category">カテゴリ</div>
      <div class="cat-chips">
        <div class="cat-chip active" onclick="selectCat(this,'sparkling')" data-i18n="cat_chip_sparkling">🥂 泡</div>
        <div class="cat-chip"       onclick="selectCat(this,'white')" data-i18n="cat_chip_white">🍾 白</div>
        <div class="cat-chip"       onclick="selectCat(this,'red')" data-i18n="cat_chip_red">🍷 赤</div>
        <div class="cat-chip"       onclick="selectCat(this,'rose')" data-i18n="cat_chip_rose">🌸 ロゼ</div>
        <div class="cat-chip"       onclick="selectCat(this,'orange')" data-i18n="cat_chip_orange">🟠 橙</div>
      </div>
      <!-- Fields -->
      <div class="field-label" data-i18n="field_name">ワイン名</div>
      <input class="field-input" id="f-name" data-i18n-ph="ph_name" placeholder="例: Gevrey-Chambertin">
      <div class="field-label" data-i18n="field_producer">生産者</div>
      <input class="field-input" id="f-producer" data-i18n-ph="ph_producer" placeholder="例: Rossignol-Trapet">
      <div class="field-row">
        <div>
          <div class="field-label" data-i18n="field_vintage">ヴィンテージ</div>
          <input class="field-input" id="f-vintage" placeholder="2020">
        </div>
        <div>
          <div class="field-label" data-i18n="field_bottles">本数</div>
          <input class="field-input" id="f-bottles" type="number" min="1" value="1">
        </div>
      </div>
      <div class="field-label" data-i18n="field_region">産地</div>
      <input class="field-input" id="f-region" data-i18n-ph="ph_region" placeholder="例: ブルゴーニュ, フランス">
      <div class="field-label" data-i18n="field_grapes">品種</div>
      <input class="field-input" id="f-grapes" data-i18n-ph="ph_grapes" placeholder="例: ピノ・ノワール">
      <div class="field-row">
        <div>
          <div class="field-label" data-i18n="field_price">購入価格（¥）</div>
          <input class="field-input" id="f-price" type="number" placeholder="8800">
        </div>
        <div>
          <div class="field-label" data-i18n="field_date">購入日</div>
          <input class="field-input" id="f-date" type="date">
        </div>

// 2026-07-07: 新規ユーザーに架空のサンプル8本が「自分のセラー」として見える不具合を修正。
// 空で開始し、localStorage（端末キャッシュ）→サーバー（user_cellar）の順に実データを反映する。
let cellar = [];

// ── 端末に保存（localStorageはオフラインキャッシュ。正本はサーバーのuser_cellar） ──
const CELLAR_KEY = 'somm_cellar_v1';
const CELLAR_API_BASE = 'https://sommelin-trade-platform-1076605563046.asia-northeast1.run.app';
try { const _s = localStorage.getItem(CELLAR_KEY); if (_s) { const _a = JSON.parse(_s); if (Array.isArray(_a)) cellar = _a; } } catch (e) {}
nextId = Math.max(nextId, 101, ...cellar.map(w => (w.id || 0) + 1));
function saveCellar(){ try { localStorage.setItem(CELLAR_KEY, JSON.stringify(cellar)); } catch (e) {} }

// サーバー同期: 変更時にupsert（アカウント紐付け済みなら他端末にも反映される）
function syncWineToServer(w){
  let uid=null; try{ uid=localStorage.getItem('somm_uid'); }catch(e){}
  if(!uid) return;
  fetch(CELLAR_API_BASE+'/api/cellar',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ userId:uid, clientRowId:String(w.id), name:w.name, vintage:w.vintage,
      region:w.region, producer:w.producer, cat:w.cat, bottles:w.bottles, note:w.note, isPublic: !!w.isPublic })
  }).catch(()=>{});
}

// 公開/非公開の切り替え（2026-07-08追加: マイセラーをホームからも見られるようにするため）
function toggleCellarPublic(id){
  const w = cellar.find(x => x.id === id);
  if (!w) return;
  w.isPublic = !w.isPublic;
  saveCellar();
  renderCellar();
  let uid=null; try{ uid=localStorage.getItem('somm_uid'); }catch(e){}
  if(!uid) return;
  fetch(CELLAR_API_BASE+'/api/cellar/visibility',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ userId:uid, clientRowId:String(w.id), isPublic: !!w.isPublic })
  }).catch(()=>{});
}

// ページロード時: サーバーの内容を取得し、端末キャッシュより新しければ描画に反映
async function loadCellarFromServer(){
  let uid=null; try{ uid=localStorage.getItem('somm_uid'); }catch(e){}
  if(!uid) return;
  try{
    const r = await fetch(CELLAR_API_BASE+'/api/cellar?userId='+encodeURIComponent(uid));
    if(!r.ok) return;
    const { items } = await r.json();
    if(!Array.isArray(items) || !items.length) return;
    const byRowId = {}; cellar.forEach(w => { byRowId[String(w.id)] = w; });
    items.forEach(it => {
      const rowId = it.client_row_id || it.id;
      byRowId[rowId] = {
        id: isNaN(Number(rowId)) ? rowId : Number(rowId),
        cat: it.cat || 'red', name: it.name || t('unnamed'), producer: it.producer || '—',
        vintage: it.vintage || '—', region: it.region || '—', grapes: '—',
        bottles: it.bottles != null ? it.bottles : 1, price: 0,
        date: (it.updated_at||'').split('T')[0] || '', note: it.note || '', hasLabel:false,
        isPublic: !!it.is_public,
      };
    });
    cellar = Object.values(byRowId).filter(w => w.bottles > 0);
    nextId = Math.max(nextId, 101, ...cellar.map(w => (typeof w.id==='number'?w.id:0) + 1));
    saveCellar();
    renderSummary(); renderCellar();
  }catch(e){}
}

function renderSummary() {
  const total = cellar.reduce((s,w) => s + w.bottles, 0);
  const totalSpend = cellar.reduce((s,w) => s + w.price, 0);
  const cats = [...new Set(cellar.map(w => w.cat))].length;
  const avgPrice = total ? Math.round(totalSpend / cellar.length) : 0;
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-item">
      <div class="summary-val">${total}</div>
      <div class="summary-label">${t('summary_total')}</div>
    </div>
    <div class="summary-item">
      <div class="summary-val">${cellar.length}</div>
      <div class="summary-label">${t('summary_wines')}</div>
    </div>
    <div class="summary-item">
      <div class="summary-val">${cats}</div>
      <div class="summary-label">${t('summary_cats')}</div>
    </div>
    <div class="summary-item">
      <div class="summary-val">${t('fmt_avg_price', { man: (avgPrice/10000).toFixed(1), yen: avgPrice.toLocaleString() })}</div>
      <div class="summary-label">${t('summary_avg')}</div>
    </div>`;
}

              <div class="cellar-vintage">${w.vintage}</div>
            </div>
            <div class="cellar-producer">${w.producer}</div>
            <div class="cellar-region">📍 ${w.region}</div>
            <div class="cellar-bottom">
              <div class="cellar-purchase">¥${w.price.toLocaleString()}</div>

function renderJournal() {
  // group by date
  const grouped = {};
  journal.forEach(j => {
    if (!grouped[j.date]) grouped[j.date] = [];
    grouped[j.date].push(j);
  });
  let html = '';
  Object.keys(grouped).sort((a,b) => b.localeCompare(a)).forEach(date => {
    const d = new Date(date);
    const label = t('fmt_date_md', {
      m: d.getMonth()+1,
      d: d.getDate(),
      mon: t('months').split(',')[d.getMonth()],
      w: t('weekdays').split(',')[d.getDay()],
    });
    html += `<div class="journal-date-header">${label}</div>`;
    grouped[date].forEach(j => {
      const cfg = catCfg[j.cat];
      const stars = '★'.repeat(j.rating) + '☆'.repeat(5-j.rating);
      html += `
        <div class="journal-card">
          <div class="journal-card-top">
            <div class="journal-cat-dot" style="background:${cfg.bg}">${cfg.emoji}</div>
            <div class="journal-card-info">
              <div class="journal-wine-name">${j.name}</div>
              <div class="journal-wine-sub">${j.vintage} · ${j.region}</div>
            </div>
            <div class="journal-stars">${stars.split('').map((s,i) => `<span class="star" style="color:${i < j.rating ? '#C9973A' : '#ddd'}">${s}</span>`).join('')}</div>
          </div>
          ${j.note ? `<div class="journal-note">${j.note}</div>` : ''}
          <div class="journal-place">📍 ${j.place}</div>
        </div>`;
    });
  });
  document.getElementById('journalList').innerHTML = html;
}

function renderStats() {
  // cat breakdown
  const catBreak = document.getElementById('catBreakdown');
  catBreak.innerHTML = Object.entries(catCfg).map(([cat, cfg]) => {
    const total = cellar.filter(w => w.cat === cat).reduce((s,w) => s + w.bottles, 0);
    return `<div class="cat-item">
      <div class="cat-item-icon" style="background:${cfg.bg}">${cfg.emoji}</div>
      <div class="cat-item-count">${total}</div>
      <div class="cat-item-label">${t('catshort_' + cat)}</div>
    </div>`;
  }).join('');

  // region chart
  const regions = {};
  journal.forEach(j => {
    const r = j.region; regions[r] = (regions[r]||0) + 1;
  });
  const topRegions = Object.entries(regions).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxR = topRegions[0]?.[1] || 1;
  document.getElementById('regionChart').innerHTML = topRegions.map(([r,c]) => `
    <div class="bar-row">
      <div class="bar-label">${r}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${c/maxR*100}%;background:var(--burgundy)"></div></div>
      <div class="bar-count">${t('fmt_n_bottles', { n: c })}</div>
    </div>`).join('');

  // grape chart
  const grapes = {};
  cellar.forEach(w => {
    w.grapes.split('/').forEach(g => {
      const gg = g.trim(); grapes[gg] = (grapes[gg]||0) + 1;
    });
  });
  const topGrapes = Object.entries(grapes).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxG = topGrapes[0]?.[1] || 1;
  document.getElementById('grapeChart').innerHTML = topGrapes.map(([g,c]) => `
    <div class="bar-row">
      <div class="bar-label">${g}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${c/maxG*100}%;background:var(--gold)"></div></div>
      <div class="bar-count">${t('fmt_n_bottles', { n: c })}</div>
    </div>`).join('');

  // rating
  const ratings = {5:0,4:0,3:0,2:0,1:0};
  journal.forEach(j => ratings[j.rating]++);
  const maxRat = Math.max(...Object.values(ratings), 1);
  document.getElementById('ratingChart').innerHTML = [5,4,3,2,1].map(r => `
    <div class="rating-row">
      <div class="rating-stars">${'★'.repeat(r)}${'☆'.repeat(5-r)}</div>
      <div class="rating-bar-track"><div class="rating-bar-fill" style="width:${ratings[r]/maxRat*100}%"></div></div>
      <div class="rating-count">${ratings[r]}</div>
    </div>`).join('');

  // spending
  const totalSpend = cellar.reduce((s,w)=>s+w.price,0);
  const thisYear = cellar.filter(w=>w.date.startsWith('2026')).reduce((s,w)=>s+w.price,0);
  document.getElementById('spendingBlock').innerHTML = `
    <div class="spending-row">
      <span class="spending-label">${t('spend_year')}</span>
      <span class="spending-val highlight">¥${thisYear.toLocaleString()}</span>
    </div>
    <div class="spending-row">
      <span class="spending-label">${t('spend_value')}</span>
      <span class="spending-val">¥${totalSpend.toLocaleString()}</span>
    </div>
    <div class="spending-row">
      <span class="spending-label">${t('spend_wines')}</span>
      <span class="spending-val">${t('fmt_n_kinds', { n: cellar.length })}</span>
    </div>
    <div class="spending-row">
      <span class="spending-label">${t('spend_recorded')}</span>
      <span class="spending-val">${t('fmt_n_bottles', { n: journal.length })}</span>
    </div>`;
}

// ── INTERACTIONS ──
function switchTab(tab) {
  ['cellar','journal','stats'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('panel-' + t).classList.toggle('active', t === tab);
  });
}

function filterCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderCellar();
}

function changeStock(id, delta) {
  const w = cellar.find(x => x.id === id);
  if (!w) return;
  const newVal = w.bottles + delta;
  if (newVal < 0) return;
  w.bottles = newVal;
  if (newVal === 0) {
    showToast(t('toast_last'));
    cellar = cellar.filter(x => x.id !== id);
  } else {
    showToast(delta > 0 ? t('toast_plus1') : t('toast_minus1'));
  }
  saveCellar();
  syncWineToServer(w);
  renderSummary();
  renderCellar();
}

// ── ADD MODAL ──
function openAddModal() {
  document.getElementById('addModalBg').classList.add('open');
  document.body.style.overflow = 'hidden';
  // set today's date
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f-date').value = today;
}
function closeAddModal(e) {
  if (e && e.target !== document.getElementById('addModalBg')) return;
  document.getElementById('addModalBg').classList.remove('open');
  document.body.style.overflow = '';
}
function selectCat(el, cat) {
  selectedCatForAdd = cat;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}
function simulateScan() {
  const scanMsg = document.querySelector('.camera-area .label');
  const scanSub = document.querySelector('.camera-area .sub');
  scanMsg.textContent = t('scan_analyzing');
  scanSub.textContent = t('scan_analyzing_sub');
  setTimeout(() => {
    document.getElementById('f-name').value = 'Chambolle-Musigny';
    document.getElementById('f-producer').value = 'Domaine Mugnier';
    document.getElementById('f-vintage').value = '2020';
    document.getElementById('f-region').value = 'ブルゴーニュ, フランス';
    document.getElementById('f-grapes').value = 'ピノ・ノワール';
    document.getElementById('f-price').value = '19800';
    document.getElementById('f-bottles').value = '1';
    // switch to red
    selectedCatForAdd = 'red';
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
    document.querySelector('.cat-chip:nth-child(4)').classList.add('active');
    scanMsg.textContent = t('scan_done');
    scanSub.textContent = t('scan_done_sub');
    showToast(t('toast_label_got'));
  }, 1600);
}
function saveWine() {
  if(window.sommLog) sommLog('cellar_add');
  const name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }
  const w = {
    id: nextId++,
    cat: selectedCatForAdd,
    name,
    producer: document.getElementById('f-producer').value || '—',
    vintage:  document.getElementById('f-vintage').value  || '—',
    region:   document.getElementById('f-region').value   || '—',
    grapes:   document.getElementById('f-grapes').value   || '—',
    bottles:  parseInt(document.getElementById('f-bottles').value) || 1,
    price:    parseInt(document.getElementById('f-price').value)   || 0,
    date:     document.getElementById('f-date').value || new Date().toISOString().split('T')[0],
    note:     document.getElementById('f-note').value || '',
    hasLabel: false,
  };
  cellar.unshift(w);
  saveCellar();
  syncWineToServer(w);
  // reset form
  ['f-name','f-producer','f-vintage','f-region','f-grapes','f-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-bottles').value = '1';
  document.getElementById('f-price').value = '';
  document.querySelector('.camera-area .label').textContent = t('scan_label');
  document.querySelector('.camera-area .sub').textContent = t('scan_sub');
  closeAddModal();
  renderSummary();
  renderCellar();
  showToast(t('toast_added'));
}

// ── DETAIL MODAL ──

  const cfg = catCfg[w.cat];
  document.getElementById('detailContent').innerHTML = `
    <div class="modal-handle"></div>
    <div class="detail-section" style="padding-top:24px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span style="background:${cfg.bg};border-radius:10px;padding:6px 10px;font-size:18px;">${cfg.emoji}</span>
        <span style="font-size:11px;font-weight:700;color:var(--text-sub);">${cfg.label}</span>
      </div>
      <div style="font-size:19px;font-weight:900;color:var(--text);line-height:1.3;margin-bottom:4px;">${w.name}</div>
      <div style="font-size:13px;color:var(--text-sub);">${w.producer}</div>
    </div>
    <div class="detail-section">
      <div class="detail-row"><span class="detail-label">${t('detail_vintage')}</span><span class="detail-val">${w.vintage}</span></div>
      <div class="detail-row"><span class="detail-label">${t('detail_region')}</span><span class="detail-val">${w.region}</span></div>
      <div class="detail-row"><span class="detail-label">${t('detail_grapes')}</span><span class="detail-val">${w.grapes}</span></div>
      <div class="detail-row"><span class="detail-label">${t('detail_stock')}</span><span class="detail-val" style="color:var(--burgundy);font-size:16px;">${t('fmt_stock', { n: w.bottles })}</span></div>
      <div class="detail-row"><span class="detail-label">${t('detail_price')}</span><span class="detail-val">¥${w.price.toLocaleString()}</span></div>
      <div class="detail-row"><span class="detail-label">${t('detail_date')}</span><span class="detail-val">${w.date}</span></div>
      ${w.note ? `<div class="detail-row"><span class="detail-label">${t('detail_note')}</span><span class="detail-val" style="font-size:12px;">${w.note}</span></div>` : ''}
    </div>
    <div class="detail-section">
      <button class="drink-btn" onclick="drinkOne(${w.id})">${t('drink_one')}</button>
    </div>`;
  document.getElementById('detailModalBg').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDetail(e) {
  if (e && e.target !== document.getElementById('detailModalBg') &&
      !e.target.classList.contains('modal-close-btn')) return;
  document.getElementById('detailModalBg').classList.remove('open');
  document.body.style.overflow = '';
}
function drinkOne(id) {
  closeDetail();
  changeStock(id, -1);
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
