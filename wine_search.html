<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ワイン検索 — ソムリン</title>
  <style>
    :root {
      --burgundy: #9B1B4B;
      --wine-dark: #5C0E2A;
      --gold: #C9973A;
      --gold-light: #F5E6C8;
      --bg: #FDFAF7;
      --text: #2C1810;
      --gray: #888;
      --light-gray: #F0EDE8;
      --card: #fff;
      --rakuten: #BF0000;
      --amazon: #FF9900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
    }

    /* ── HERO HEADER ── */
    .hero {
      background: linear-gradient(165deg, var(--wine-dark) 0%, #7A1535 60%, #9B2545 100%);
      padding: 52px 20px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 70% 30%, rgba(201,151,58,.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-label {
      font-size: 11px; font-weight: 700;
      color: var(--gold); letter-spacing: .1em;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .hero-title {
      font-size: 22px; font-weight: 800; color: #fff;
      line-height: 1.35; margin-bottom: 6px;
    }
    .hero-sub { font-size: 12px; color: rgba(255,255,255,.65); line-height: 1.6; margin-bottom: 22px; }

    /* SEARCH BOX */
    .search-box {
      background: #fff;
      border-radius: 16px;
      display: flex; align-items: center;
      padding: 4px 6px 4px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
      gap: 6px;
    }
    .search-icon { font-size: 18px; flex-shrink: 0; }
    .search-input {
      flex: 1; border: none; outline: none;
      font-size: 15px; color: var(--text);
      background: transparent; padding: 10px 0;
      -webkit-appearance: none;
    }
    .search-input::placeholder { color: #bbb; }
    .search-go {
      padding: 10px 16px;
      background: var(--burgundy); color: #fff;
      border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
      transition: background .15s;
    }
    .search-go:active { background: var(--wine-dark); }

    /* QUICK CHIPS */
    .quick-area {
      padding: 14px 20px 6px;
      background: var(--wine-dark);
    }
    .quick-label { font-size: 10px; color: rgba(255,255,255,.55); margin-bottom: 8px; letter-spacing: .05em; }
    .quick-row {
      display: flex; gap: 7px; flex-wrap: wrap;
    }
    .quick-chip {
      padding: 5px 12px;
      border-radius: 20px; border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.1); color: rgba(255,255,255,.85);
      font-size: 12px; cursor: pointer; transition: all .15s;
    }
    .quick-chip:active { background: var(--gold); border-color: var(--gold); color: #fff; }

    /* MAIN CONTENT */
    .content { padding: 20px 16px 100px; }

    /* ── RESULTS ── */
    .results-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px;
    }
    .results-query {
      font-size: 14px; font-weight: 700; color: var(--wine-dark);
      flex: 1; word-break: break-all;
    }
    .results-query span { color: var(--burgundy); }
    .results-clear {
      font-size: 12px; color: var(--gray);
      background: none; border: none; cursor: pointer;
      padding: 4px 8px; border-radius: 8px;
      border: 1px solid var(--light-gray);
    }

    /* SECTION HEADER */
    .sec-head {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700;
      color: var(--wine-dark); margin-bottom: 10px;
    }
    .sec-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 10px; background: var(--gold-light); color: var(--gold);
    }
    .sec-divider { margin: 20px 0 14px; border: none; border-top: 1px solid var(--light-gray); }

    /* ONLINE STORE CARD */
    .ol-card {
      background: var(--card); border-radius: 14px;
      padding: 14px; margin-bottom: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      display: flex; align-items: center; gap: 12px;
    }
    .ol-logo {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .ol-info { flex: 1; min-width: 0; }
    .ol-name {
      font-size: 14px; font-weight: 700; margin-bottom: 3px;
      display: flex; align-items: center; gap: 6px;
    }
    .aff-pill {
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; letter-spacing: .03em;
    }
    .ol-sub { font-size: 11px; color: var(--gray); line-height: 1.5; }
    .ol-btn {
      padding: 10px 16px; border: none; border-radius: 20px;
      font-size: 13px; font-weight: 700; color: #fff;
      cursor: pointer; flex-shrink: 0; white-space: nowrap;
      transition: opacity .15s;
    }
    .ol-btn:active { opacity: .8; }

    /* AFFILIATE NOTICE */
    .aff-notice {
      background: var(--gold-light); border-radius: 12px;
      padding: 12px 14px; margin-top: 6px;
      font-size: 11px; color: #7A5C2A; line-height: 1.7;
    }
    .aff-notice strong { display: block; font-size: 12px; margin-bottom: 2px; }

    /* REAL STORE — COMING SOON */
    .store-coming {
      background: var(--card); border-radius: 14px;
      padding: 24px 20px; text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .store-coming-emoji { font-size: 36px; margin-bottom: 12px; }
    .store-coming h3 { font-size: 15px; font-weight: 700; color: var(--wine-dark); margin-bottom: 8px; }
    .store-coming p { font-size: 13px; color: var(--gray); line-height: 1.7; }
    .store-register-btn {
      margin-top: 14px;
      display: inline-block; padding: 10px 22px;
      background: var(--burgundy); color: #fff;
      border: none; border-radius: 20px;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .register-note {
      margin-top: 10px; font-size: 11px; color: var(--gray); line-height: 1.6;
    }

    /* ── LOCAL STORE INVENTORY RESULTS ── */
    .lstore-count {
      font-size: 12px; color: var(--burgundy); font-weight: 700;
      margin-bottom: 10px; padding: 6px 12px;
      background: rgba(155,27,75,.08); border-radius: 20px;
      display: inline-block;
    }
    .lstore-card {
      background: var(--card); border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      border-left: 3px solid var(--burgundy);
    }
    .lstore-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .lstore-name {
      font-size: 15px; font-weight: 700; color: var(--wine-dark);
    }
    .lstore-meta {
      font-size: 11px; color: var(--gray); margin-top: 2px;
      display: flex; align-items: center; gap: 6px;
    }
    .lstore-dist {
      background: var(--burgundy); color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px;
    }
    .lstore-inquiry {
      background: var(--burgundy); color: #fff;
      border: none; border-radius: 16px;
      font-size: 11px; font-weight: 700;
      padding: 6px 14px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .lstore-wine {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid rgba(0,0,0,.06);
    }
    .lstore-wine-info { flex: 1; min-width: 0; }
    .lstore-wine-name {
      font-size: 13px; font-weight: 600; color: var(--wine-dark);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lstore-wine-meta {
      font-size: 11px; color: var(--gray); margin-top: 2px;
    }
    .lstore-wine-right {
      text-align: right; flex-shrink: 0; margin-left: 10px;
    }
    .lstore-price {
      font-size: 13px; font-weight: 700; color: var(--burgundy);
    }
    .lstore-type {
      font-size: 10px; color: var(--gray);
      background: rgba(0,0,0,.05); border-radius: 8px;
      padding: 2px 6px; margin-top: 3px; display: inline-block;
    }

    /* ── IMPORTER CATALOG SECTION ── */
    .imp-section-label {
      font-size: 12px; font-weight: 700; color: var(--gray);
      text-transform: uppercase; letter-spacing: .04em;
      margin: 16px 0 8px;
    }
    .imp-card {
      background: var(--card); border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      border-left: 3px solid var(--gold);
    }
    .imp-card .lstore-name { color: #7a5a00; }
    .imp-btn {
      background: var(--gold); color: #fff;
      border: none; border-radius: 16px;
      font-size: 11px; font-weight: 700;
      padding: 6px 14px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }

    /* ── EMPTY / INITIAL STATE ── */
    .initial-state { padding-top: 10px; }

    .intro-card {
      background: var(--card); border-radius: 16px;
      padding: 20px; margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .intro-card-title {
      font-size: 14px; font-weight: 700; color: var(--wine-dark);
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .intro-flow {
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap;
    }
    .flow-step {
      padding: 7px 12px;
      background: var(--light-gray); border-radius: 10px;
      font-size: 12px; font-weight: 500; color: var(--text);
    }
    .flow-arrow { font-size: 14px; color: var(--gray); flex-shrink: 0; }

    .use-cases { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .use-case {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--card); border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }
    .uc-icon { font-size: 22px; flex-shrink: 0; }
    .uc-body { }
    .uc-title { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
    .uc-desc { font-size: 12px; color: var(--gray); line-height: 1.5; }

    /* EXAMPLE SEARCHES */
    .ex-label {
      font-size: 12px; font-weight: 700; color: var(--gray);
      margin: 18px 0 10px;
    }
    .ex-list { display: flex; flex-direction: column; gap: 6px; }
    .ex-item {
      background: var(--card); border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: background .15s;
    }
    .ex-item:active { background: var(--gold-light); }
    .ex-cat { font-size: 18px; flex-shrink: 0; }
    .ex-info { flex: 1; min-width: 0; }
    .ex-name { font-size: 13px; font-weight: 700; }
    .ex-meta { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .ex-arrow { font-size: 14px; color: #ccc; }
  </style>
</head>
<body>

<!-- HERO HEADER -->
<div class="hero">
  <div class="hero-label">🔍 ワイン検索</div>
  <div class="hero-title">飲みたいワインを<br>どこで買う？どこで飲む？</div>
  <div class="hero-sub">ワイン名・生産者・産地を入力すると<br>購入先・飲めるお店が見つかります</div>
  <div class="search-box">
    <span class="search-icon">🍷</span>
    <input class="search-input" id="searchInput" type="search"
      placeholder="例: Sassicaia, シャトー・マルゴー..." autocomplete="off" spellcheck="false">
    <button class="search-go" id="searchBtn">検索</button>
  </div>
</div>

<!-- QUICK SUGGESTION CHIPS -->
<div class="quick-area">
  <div class="quick-label">POPULAR SEARCHES</div>
  <div class="quick-row" id="quickRow">
    <button class="quick-chip" onclick="doSearch('シャトー・マルゴー')">シャトー・マルゴー</button>
    <button class="quick-chip" onclick="doSearch('バローロ')">バローロ</button>
    <button class="quick-chip" onclick="doSearch('ドン・ペリニヨン')">ドン・ペリニヨン</button>
    <button class="quick-chip" onclick="doSearch('Opus One')">Opus One</button>
    <button class="quick-chip" onclick="doSearch('プイィ・フュメ')">プイィ・フュメ</button>
    <button class="quick-chip" onclick="doSearch('コート・デュ・ローヌ')">コート・デュ・ローヌ</button>
    <button class="quick-chip" onclick="doSearch('カベルネ・ソーヴィニヨン')">カベルネ・ソーヴィニヨン</button>
  </div>
</div>

<!-- MAIN -->
<div class="content" id="content">
  <!-- Initial state is rendered by JS -->
</div>

<script>
// ================================================================
// ONLINE STORES
// ================================================================
const STORES = [
  {
    id: 'rakuten', name: '楽天市場', sub: '楽天ポイント最大10倍 · 送料無料対象あり',
    emoji: '🛍️', color: '#BF0000', affiliate: true,
    url: q => `https://hb.afl.rakuten.co.jp/ichiba/54fd9c11.81f2fbf7.54fd9c12.f3705f45/?pc=${encodeURIComponent('https://search.rakuten.co.jp/search/mall/' + encodeURIComponent(q + ' ワイン') + '/100433/')}`
  },
  {
    id: 'amazon', name: 'Amazon', sub: 'Prime対象は翌日お届け · 最安値比較あり',
    emoji: '📦', color: '#FF9900', affiliate: true,
    url: q => `https://www.amazon.co.jp/s?k=${encodeURIComponent(q + ' ワイン')}&tag=sommelin0f-22`
  },
  {
    id: 'enoteca', name: 'エノテカ オンライン', sub: 'ソムリエ厳選 · ギフト包装対応',
    emoji: '🍾', color: '#9B1B4B', affiliate: false,
    url: q => `https://www.enoteca.co.jp/search/?keyword=${encodeURIComponent(q)}`
  },
  {
    id: 'wbs', name: 'ワインバザール', sub: '豊富な品揃え · 1本から購入OK',
    emoji: '🏪', color: '#2E7D32', affiliate: false,
    url: q => `https://winebazaar.jp/search?q=${encodeURIComponent(q)}`
  },
];

// ================================================================
// EXAMPLE WINES (デモ用 — DBとは無関係)
// ================================================================
const EXAMPLES = [
  { emoji:'🍷', name:'サッシカイア 2018',         meta:'Sassicaia · イタリア トスカーナ · 赤ワイン',         q:'Sassicaia 2018' },
  { emoji:'🥂', name:'シャトー・ムートン・ロートシルト', meta:'Ch.Mouton Rothschild · フランス ボルドー · 赤', q:'Château Mouton Rothschild' },
  { emoji:'✨', name:'クリュッグ グランド・キュヴェ',   meta:'Krug Grande Cuvée · フランス シャンパーニュ',      q:'Krug Grande Cuvée' },
  { emoji:'🥂', name:'バタール・モンラッシェ',         meta:'Bâtard-Montrachet · フランス ブルゴーニュ · 白', q:'Bâtard-Montrachet' },
  { emoji:'🍷', name:'アマローネ・デッラ・ヴァルポリチェッラ', meta:'Amarone · イタリア ヴェネト · 赤ワイン',   q:'Amarone della Valpolicella' },
  { emoji:'🌸', name:'プロヴァンス・ロゼ',            meta:'Provence Rosé · フランス · ロゼワイン',            q:'Provence Rosé ワイン' },
];

// ================================================================
// STATE
// ================================================================
let currentQuery = '';

// ================================================================
// RENDER
// ================================================================
window.addEventListener('DOMContentLoaded', renderInitial);

document.getElementById('searchBtn').addEventListener('click', () => {
  const q = document.getElementById('searchInput').value.trim();
  if (q) doSearch(q);
});
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = document.getElementById('searchInput').value.trim();
    if (q) doSearch(q);
  }
});

// ── ソムリン評価（Supabase master と照合：SP＋コスパ） ──
const SB_URL = 'https://gkhdpzfmqraliwaiubwl.supabase.co';
const SB_KEY = 'sb_publishable_p-8MZjT4azg59TAtQgChhA___PLMlDV';
function _cospa(osu){
  if(osu==null||isNaN(osu)) return {st:'—',lbl:'コスパ算定中',bg:'#9aa0a6'};
  if(osu>=0.5)  return {st:'★★★★★',lbl:'圧倒的コスパ',bg:'#1e8449'};
  if(osu>=0.3)  return {st:'★★★★', lbl:'高コスパ',  bg:'#27ae60'};
  if(osu>=0.1)  return {st:'★★★',  lbl:'良コスパ',  bg:'#9B1B4B'};
  if(osu>=-0.1) return {st:'★★',   lbl:'価格相応',  bg:'#8a6d3b'};
  return               {st:'★',    lbl:'やや割高',  bg:'#a5673f'};
}
function _p(p){ return (p==null||isNaN(p))?'—':('¥'+Math.round(p).toLocaleString('ja-JP')); }
function _sp(s){ return (s==null||isNaN(s))?'—':Number(s).toFixed(1); }
async function loadMaster(q){
  const el=document.getElementById('masterSec'); if(!el) return;
  el.innerHTML='<div style="padding:10px 4px;color:#999;font-size:12px;">🍷 ソムリン評価を照合中…</div>';
  let rows=[];
  try{
    const r=await fetch(SB_URL+'/rest/v1/rpc/match_wines',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY},
      body:JSON.stringify({q:q,lim:5})});
    if(r.ok) rows=await r.json();
  }catch(e){}
  if(!rows||!rows.length){ el.innerHTML=''; return; }   // 見つからなければ非表示（外部リンクは残す）
  const top=rows[0];
  const cp=_cospa(top.osu_gbm!=null?top.osu_gbm:top.osu_lin);
  const region=[top.kuni,top.chiiki].filter(Boolean).join(' ');
  const vint=(top.vintage&&top.vintage!=='NV')?(' '+top.vintage):'';
  let alts='';
  if(rows.length>1){
    alts=rows.slice(1,3).map(w=>{
      const c=_cospa(w.osu_gbm!=null?w.osu_gbm:w.osu_lin);
      return `<div onclick="doSearch('${(w.name||'').replace(/'/g,"\\'")}')" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:#faf7f8;border-radius:10px;margin-top:6px;cursor:pointer;">
        <div style="min-width:0;"><div style="font-size:12px;font-weight:700;color:#2C1810;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(w.name||'')}</div><div style="font-size:10px;color:#999;">${escHtml([w.kuni,w.chiiki].filter(Boolean).join(' '))}</div></div>
        <div style="text-align:right;white-space:nowrap;"><div style="font-size:11px;color:${c.bg};font-weight:800;">${c.st}</div><div style="font-size:10px;color:#888;">SP ${_sp(w.sp)}</div></div>
      </div>`;
    }).join('');
  }
  el.innerHTML=`
    <div class="sec-head">🍷 ソムリン評価（コスパ）<span class="sec-badge" style="background:#9B1B4B18;color:#9B1B4B;">master</span></div>
    <div style="background:#fff;border:1px solid #f0e6ea;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);">
      <div style="font-size:16px;font-weight:800;color:#2C1810;line-height:1.3;">${escHtml(top.name||'')}${escHtml(vint)}</div>
      <div style="font-size:12px;color:#888;margin:3px 0 10px;">${escHtml(region)}${top.producer?(' / '+escHtml(top.producer)):''}</div>
      <div style="display:flex;gap:10px;align-items:stretch;">
        <div style="flex:1;text-align:center;background:#faf7f8;border-radius:10px;padding:10px;">
          <div style="font-size:22px;font-weight:900;color:#9B1B4B;line-height:1;">${_sp(top.sp)}</div>
          <div style="font-size:10px;color:#999;margin-top:3px;">SP（ソムリン評価）</div>
        </div>
        <div style="flex:1;text-align:center;background:#faf7f8;border-radius:10px;padding:10px;">
          <div style="font-size:18px;font-weight:900;color:#2C1810;line-height:1.2;">${_p(top.price)}</div>
          <div style="font-size:10px;color:#999;margin-top:3px;">参考価格</div>
        </div>
        <div style="flex:1.2;text-align:center;background:${cp.bg};color:#fff;border-radius:10px;padding:10px;">
          <div style="font-size:15px;line-height:1.1;">${cp.st}</div>
          <div style="font-size:11px;font-weight:800;margin-top:3px;">${cp.lbl}</div>
        </div>
      </div>
      ${alts}
    </div>
    <hr class="sec-divider">
  `;
}

function doSearch(q) {
  if(window.sommLog) sommLog('search',{q:String(q||'').slice(0,50)});
  currentQuery = q;
  document.getElementById('searchInput').value = q;
  renderResults(q);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderInitial() {
  // Auto-search if launched with ?q= (e.g. from AR scanner "購入先を探す")
  const params = new URLSearchParams(window.location.search);
  const qParam = params.get('q');
  if (qParam && qParam.trim()) {
    doSearch(qParam.trim());
    return;
  }

  document.getElementById('content').innerHTML = `
    <div class="initial-state">

// ── ローカル在庫検索（localStorage連携） ───────────────────────
function normalizeWineName(s) {
  return (s || '').toLowerCase().replace(/[\s\-\.]/g, '');
}

function matchWine(wineName, query) {
  const wn = normalizeWineName(wineName);
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  // 全単語がワイン名に含まれるか、またはワイン名の一部がクエリに含まれるか
  return terms.every(t => wn.includes(t.replace(/[\s\-\.]/g,''))) ||
    terms.some(t => t.length >= 4 && wn.includes(t.replace(/[\s\-\.]/g,'')));
}

// ── 近くのお店（実データ: 公開店舗の restaurant_wines。旧localStorageデモは廃止） ──
function emptyStoreHtml(q) {
  return `<div class="store-coming">
    <div class="store-coming-emoji">🗺️</div>
    <h3>「${escHtml(q)}」を取り扱うお店を募集中</h3>
    <p>ワインショップ・レストランが在庫情報を<br>登録することで、ここに表示されます。</p>
    <button class="store-register-btn" onclick="location.href='restaurant_admin.html'">
      🏪 店舗として登録する
    </button>
    <div class="register-note">※ 登録は無料です。掲載後はソムリンユーザーへ公開されます。</div>
  </div>`;
}

async function loadLocalStores(q) {
  const box = document.getElementById('localStores');
  if (!box) return;
  try {
    // クエリ整形（scouterからの「◯◯ ワイン」形式にも対応）
    const clean = (q || '').replace(/ワイン/g, ' ').trim();
    const tokens = clean.split(/\s+/).filter(t => t.length >= 2);
    const key = tokens.sort((a, b) => b.length - a.length)[0] || clean;
    if (!key) { box.innerHTML = emptyStoreHtml(q); return; }

    const H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };
    // RLS: 公開設定ONの店舗の行しか返らない（非公開店は自動的に除外される）
    const rw = await fetch(SB_URL + '/rest/v1/restaurant_wines'
      + '?select=owner_id,name,vintage,region,price_bottle,price_glass,stock'
      + '&available=eq.true&name=ilike.' + encodeURIComponent('*' + key + '*') + '&limit=100', { headers: H });
    let rows = rw.ok ? await rw.json() : [];
    if (tokens.length > 1) rows = rows.filter(r => matchWine(r.name, clean));
    if (!rows.length) { box.innerHTML = emptyStoreHtml(q); return; }

    // 店舗名・住所（restaurant_settings。公開店のみ読める）
    const owners = [...new Set(rows.map(r => r.owner_id))];
    const rs = await fetch(SB_URL + '/rest/v1/restaurant_settings?owner_id=in.(' + owners.join(',') + ')&select=owner_id,display_name,address', { headers: H });
    const settings = rs.ok ? await rs.json() : [];
    const byOwner = {}; settings.forEach(s => byOwner[s.owner_id] = s);

    const byStore = {};
    rows.forEach(r => {
      const s = byOwner[r.owner_id];
      if (!s || !s.display_name) return;   // 店舗名未設定の店は表示しない
      if (!byStore[r.owner_id]) byStore[r.owner_id] = { name: s.display_name, addr: s.address || '', wines: [] };
      byStore[r.owner_id].wines.push(r);
    });
    const stores = Object.entries(byStore);
    if (!stores.length) { box.innerHTML = emptyStoreHtml(q); return; }

    let html = `<div class="lstore-count">📍 ${stores.length}軒で取り扱いを確認</div>`;
    stores.forEach(([oid, store]) => {
      html += `<div class="lstore-card">
        <div class="lstore-head">
          <div>
            <div class="lstore-name">${escHtml(store.name)}</div>
            <div class="lstore-meta">🏪 登録店舗${store.addr ? '　📍 ' + escHtml(store.addr) : ''}</div>
          </div>
          <button class="lstore-inquiry" onclick="inquireStore('${oid}','${escHtml(store.name)}')">問い合わせ</button>
        </div>
        ${store.wines.map(w => {
          const price = w.price_bottle || w.price_glass || 0;
          const t = (w.price_bottle && w.price_glass) ? 'ボトル/グラス' : (w.price_glass ? 'グラス' : 'ボトル');
          return `
        <div class="lstore-wine">
          <div class="lstore-wine-info">
            <div class="lstore-wine-name">${escHtml(w.name)}</div>
            <div class="lstore-wine-meta">${escHtml(w.vintage || '')}　${escHtml(w.region || '')}</div>
          </div>
          <div class="lstore-wine-right">
            <div class="lstore-price">¥${price.toLocaleString()}</div>
            <div class="lstore-type">${t}</div>
          </div>
        </div>`;
        }).join('')}
      </div>`;
    });
    box.innerHTML = html;
  } catch (e) { box.innerHTML = emptyStoreHtml(q); }
}

function inquireStore(sid, storeName) {
  showQuickModal(`📞 ${storeName} に問い合わせ`, `ご来店予約・在庫確認のお問い合わせを\nLINEまたは電話でお受けしています。\n\n🍷 ソムリンから問い合わせ機能は\n近日公開予定です！`);
}
function showQuickModal(title, msg) {
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;z-index:999;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);';
  m.innerHTML = `<div style="background:#fff;width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:24px 20px 36px;">
    <div style="font-size:15px;font-weight:800;color:#2C1810;margin-bottom:8px;">${title}</div>
    <div style="font-size:13px;color:#555;line-height:1.75;white-space:pre-line;margin-bottom:20px;">${msg}</div>
    <button onclick="this.closest('[style]').remove()" style="width:100%;padding:14px;background:#9B1B4B;color:#fff;font-size:14px;font-weight:800;border:none;border-radius:14px;cursor:pointer;">閉じる</button>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => { if(e.target===m) m.remove(); });
}

function clearResults() {
  currentQuery = '';
  document.getElementById('searchInput').value = '';
  renderInitial();
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
