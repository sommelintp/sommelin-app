<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ワイン検索 — ソムリン</title>
<meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 2026-07-10: --burgundy/--goldはsommelin-ui.cssのブランドトークンに一本化。
         --wine-darkはsommelin-ui.css未定義（あちらは--wine-deep）のためこのまま残す */
      --wine-dark: #5C0E2A;
      --gold-light: #F5E6C8;
      --bg: #FDFAF7;
      --text: #2C1810;
      --gray: #888;
      --light-gray: #F0EDE8;
      --card: #fff;
      --rakuten: #BF0000;
      --amazon: #FF9900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
    }

    /* ── HERO HEADER ── */
    .hero {
      background: linear-gradient(165deg, var(--wine-dark) 0%, #7A1535 60%, #9B2545 100%);
      padding: 52px 20px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 70% 30%, rgba(201,151,58,.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-label {
      font-size: 11px; font-weight: 700;
      color: var(--gold); letter-spacing: .1em;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 800; color: #fff;
      line-height: 1.35; margin-bottom: 6px;
    }
    .hero-sub { font-size: 12px; color: rgba(255,255,255,.65); line-height: 1.6; margin-bottom: 22px; }

    /* SEARCH BOX */
    .search-box {
      background: #fff;
      border-radius: 16px;
      display: flex; align-items: center;
      padding: 4px 6px 4px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
      gap: 6px;
    }
    .search-icon { width: 18px; height: 18px; flex-shrink: 0; stroke: var(--wine-dark); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
    .search-input {
      flex: 1; border: none; outline: none;
      font-size: 15px; color: var(--text);
      background: transparent; padding: 10px 0;
      -webkit-appearance: none;
    }
    .search-input::placeholder { color: #bbb; }
    .search-go {
      padding: 10px 16px;
      background: var(--burgundy); color: #fff;
      border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
      transition: background .15s;
    }
    .search-go:active { background: var(--wine-dark); }

    /* QUICK CHIPS */
    .quick-area {
      padding: 14px 20px 6px;
      background: var(--wine-dark);
    }
    .quick-label { font-size: 10px; color: rgba(255,255,255,.55); margin-bottom: 8px; letter-spacing: .05em; }
    .quick-row {
      display: flex; gap: 7px; flex-wrap: wrap;
    }
    .quick-chip {
      padding: 5px 12px;
      border-radius: 20px; border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.1); color: rgba(255,255,255,.85);
      font-size: 12px; cursor: pointer; transition: all .15s;
    }
    .quick-chip:active { background: var(--gold); border-color: var(--gold); color: #fff; }

    /* MAIN CONTENT */
    .content { padding: 20px 16px 100px; }

    /* ── RESULTS ── */
    .results-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px;
    }
    .results-query {
      font-size: 14px; font-weight: 700; color: var(--wine-dark);
      flex: 1; word-break: break-all;
    }
    .results-query span { color: var(--burgundy); }
    .results-clear {
      font-size: 12px; color: var(--gray);
      background: none; border: none; cursor: pointer;
      padding: 4px 8px; border-radius: 8px;
      border: 1px solid var(--light-gray);
    }

    /* SECTION HEADER */
    .sec-head {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700;
      color: var(--wine-dark); margin-bottom: 10px;
    }
    .sec-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 10px; background: var(--gold-light); color: var(--gold);
    }
    .sec-divider { margin: 20px 0 14px; border: none; border-top: 1px solid var(--light-gray); }

    /* ONLINE STORE CARD */
    .ol-card {
      background: var(--card); border-radius: 14px;
      padding: 14px; margin-bottom: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      display: flex; align-items: center; gap: 12px;
    }
    .ol-logo {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .ol-info { flex: 1; min-width: 0; }
    .ol-name {
      font-size: 14px; font-weight: 700; margin-bottom: 3px;
      display: flex; align-items: center; gap: 6px;
    }
    .aff-pill {
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; letter-spacing: .03em;
    }
    .ol-sub { font-size: 11px; color: var(--gray); line-height: 1.5; }
    .ol-btn {
      padding: 10px 16px; border: none; border-radius: 20px;
      font-size: 13px; font-weight: 700; color: #fff;
      cursor: pointer; flex-shrink: 0; white-space: nowrap;
      transition: opacity .15s;
    }
    .ol-btn:active { opacity: .8; }

    /* AFFILIATE NOTICE */
    .aff-notice {
      background: var(--gold-light); border-radius: 12px;
      padding: 12px 14px; margin-top: 6px;
      font-size: 11px; color: #7A5C2A; line-height: 1.7;
    }
    .aff-notice strong { display: block; font-size: 12px; margin-bottom: 2px; }

    /* REAL STORE — COMING SOON */
    .store-coming {
      background: var(--card); border-radius: 14px;
      padding: 24px 20px; text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .store-coming-emoji { font-size: 36px; margin-bottom: 12px; }
    .store-coming h3 { font-size: 15px; font-weight: 700; color: var(--wine-dark); margin-bottom: 8px; }
    .store-coming p { font-size: 13px; color: var(--gray); line-height: 1.7; }
    .store-register-btn {
      margin-top: 14px;
      display: inline-block; padding: 10px 22px;
      background: var(--burgundy); color: #fff;
      border: none; border-radius: 20px;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .register-note {
      margin-top: 10px; font-size: 11px; color: var(--gray); line-height: 1.6;
    }

    /* ── LOCAL STORE INVENTORY RESULTS ── */
    .lstore-count {
      font-size: 12px; color: var(--burgundy); font-weight: 700;
      margin-bottom: 10px; padding: 6px 12px;
      background: rgba(155,27,75,.08); border-radius: 20px;
      display: inline-block;
    }
    .lstore-card {
      background: var(--card); border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      border-left: 3px solid var(--burgundy);
    }
    .lstore-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .lstore-name {
      font-size: 15px; font-weight: 700; color: var(--wine-dark);
    }
    .lstore-meta {
      font-size: 11px; color: var(--gray); margin-top: 2px;
      display: flex; align-items: center; gap: 6px;
    }
    .lstore-dist {
      background: var(--burgundy); color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px;
    }
    .lstore-inquiry {
      background: var(--burgundy); color: #fff;
      border: none; border-radius: 16px;
      font-size: 11px; font-weight: 700;
      padding: 6px 14px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .lstore-wine {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid rgba(0,0,0,.06);
    }
    .lstore-wine-info { flex: 1; min-width: 0; }
    .lstore-wine-name {
      font-size: 13px; font-weight: 600; color: var(--wine-dark);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lstore-wine-meta {
      font-size: 11px; color: var(--gray); margin-top: 2px;
    }
    .lstore-wine-right {
      text-align: right; flex-shrink: 0; margin-left: 10px;
    }
    .lstore-price {
      font-size: 13px; font-weight: 700; color: var(--burgundy);
    }
    .lstore-type {
      font-size: 10px; color: var(--gray);
      background: rgba(0,0,0,.05); border-radius: 8px;
      padding: 2px 6px; margin-top: 3px; display: inline-block;
    }

    /* ── IMPORTER CATALOG SECTION ── */
    .imp-section-label {
      font-size: 12px; font-weight: 700; color: var(--gray);
      text-transform: uppercase; letter-spacing: .04em;
      margin: 16px 0 8px;
    }
    .imp-card {
      background: var(--card); border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      border-left: 3px solid var(--gold);
    }
    .imp-card .lstore-name { color: #7a5a00; }
    .imp-btn {
      background: var(--gold); color: #fff;
      border: none; border-radius: 16px;
      font-size: 11px; font-weight: 700;
      padding: 6px 14px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }

    /* ── EMPTY / INITIAL STATE ── */
    .initial-state { padding-top: 10px; }

    .browse-cta {
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, var(--wine-dark) 0%, #7A1535 100%);
      border-radius: 16px;
      padding: 16px 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(92,14,42,.25);
      cursor: pointer;
    }
    .browse-cta-icon { font-size: 26px; flex-shrink: 0; }
    .browse-cta-body { flex: 1; min-width: 0; }
    .browse-cta-title { font-size: 14.5px; font-weight: 800; color: #fff; margin-bottom: 3px; }
    .browse-cta-desc { font-size: 11.5px; color: rgba(255,255,255,.8); line-height: 1.5; }
    .browse-cta-arrow { font-size: 20px; color: var(--gold); flex-shrink: 0; }

    /* EXAMPLE SEARCHES */
    .ex-label {
      font-size: 12px; font-weight: 700; color: var(--gray);
      margin: 18px 0 10px;
    }
    .ex-list { display: flex; flex-direction: column; gap: 6px; }
    .ex-item {
      background: var(--card); border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: background .15s;
    }
    .ex-item:active { background: var(--gold-light); }
    .ex-cat { font-size: 18px; flex-shrink: 0; }
    .ex-info { flex: 1; min-width: 0; }
    .ex-name { font-size: 13px; font-weight: 700; }
    .ex-meta { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .ex-arrow { font-size: 14px; color: #ccc; }
    .lang-toggle { position: absolute; top: 16px; right: 16px; z-index: 2;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.32);
      color: #fff; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; cursor: pointer; }

    /* 常時表示の下ナビ（scouter.html等と同じ4タブ。2026-07-12: このページに下ナビが
       無く、直接遷移すると他画面へ移動できなくなる不具合の修正）。.contentに元々
       padding-bottom:100pxが確保されているのでnavの高さ分は隠れない。 */
    .search-nav {
      position: fixed; left: 0; right: 0; bottom: 0; max-width: 430px; margin: 0 auto; z-index: 600;
      background: #fff; border-top: 1px solid rgba(0,0,0,.08);
      display: flex; padding: 8px 0 env(safe-area-inset-bottom);
    }
    .search-nav a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      text-decoration: none; color: #7a5560; font-size: 10.5px; padding: 4px 0;
    }
    .search-nav a.on { color: var(--burgundy, #9B1B4B); font-weight: 700; }
    .search-nav .ic { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <link rel="stylesheet" href="assets/sommelin-ui.css">
</head>

<script>
/* ===== 多言語対応（i18n）。将来 fr/it 等も I18N に言語を1つ足すだけで拡張できる構造 ===== */
const I18N = {
  ja: {
    hero_label: 'ワイン検索',
    hero_title: '飲みたいワインを<br>どこで買う？どこで飲む？',
    hero_sub: 'ワイン名・生産者・産地を入力すると<br>購入先・飲めるお店が見つかります',
    search_ph: '例: Sassicaia, シャトー・マルゴー...',
    search_btn: '検索',
    browse_cta_title: '価格・産地・ブドウ品種で探す',
    browse_cta_desc: '予算やタイプを指定して、コスパの良いワインを一覧で見つけられます',
    ex_label: 'このワインを探してみる',
  },
  en: {
    hero_label: 'Wine Search',
    hero_title: 'Find the wine you want —<br>where to buy, where to drink',
    hero_sub: 'Enter a wine name, producer, or region<br>to find where to buy or drink it',
    search_ph: 'e.g. Sassicaia, Château Margaux...',
    search_btn: 'Search',
    browse_cta_title: 'Browse by price, region, or grape',
    browse_cta_desc: 'Set a budget or style to find good-value wines from a full list',
    ex_label: 'Try searching for these',
  },
};
let LANG = (() => { try { return localStorage.getItem('somm_lang') || (navigator.language && navigator.language.startsWith('ja') ? 'ja' : 'en'); } catch (e) { return 'ja'; } })();
function t(key) {
  const d = I18N[LANG] || I18N.ja;
  return (d && d[key] != null) ? d[key] : (I18N.ja[key] != null ? I18N.ja[key] : key);
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  const btn = document.getElementById('langBtn');
  if (btn) btn.textContent = LANG === 'ja' ? '🌐 EN' : '🌐 日本語';
  if (typeof renderInitial === 'function' && !currentQuery) renderInitial();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('somm_lang', l); } catch (e) {}
  applyI18n();
  if (window.sommLog) sommLog('lang_switch', { lang: l });
}
applyI18n(); // 静的な見出し・ボタン文言を反映（renderInitialの動的部分はDOMContentLoaded側でt()を使って描画）
</script>

const EXAMPLES = [
  { emoji:'🍷', name:'サッシカイア 2018',         meta:'Sassicaia · イタリア トスカーナ · 赤ワイン',         q:'Sassicaia 2018' },
  { emoji:'🥂', name:'シャトー・ムートン・ロートシルト', meta:'Ch.Mouton Rothschild · フランス ボルドー · 赤', q:'Château Mouton Rothschild' },

  if (q) doSearch(q);
});
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = document.getElementById('searchInput').value.trim();

});

// ── ソムリン評価（バックエンドAPIと照合：総合評価＋コスパ） ──

// ── ローカル在庫検索（localStorage連携） ───────────────────────
function normalizeWineName(s) {
  return (s || '').toLowerCase().replace(/[\s\-\.]/g, '');
}

function matchWine(wineName, query) {
  const wn = normalizeWineName(wineName);
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  // 全単語がワイン名に含まれるか、またはワイン名の一部がクエリに含まれるか
  return terms.every(t => wn.includes(t.replace(/[\s\-\.]/g,''))) ||
    terms.some(t => t.length >= 4 && wn.includes(t.replace(/[\s\-\.]/g,'')));
}

// ── 近くのお店（実データ: 公開店舗の restaurant_wines。旧localStorageデモは廃止） ──
function emptyStoreHtml(q) {
  return `<div class="store-coming">
    <div class="store-coming-emoji">🗺️</div>
    <h3>「${escHtml(q)}」を取り扱うお店を募集中</h3>
    <p>ワインショップ・レストランが在庫情報を<br>登録することで、ここに表示されます。</p>
    <button class="store-register-btn" onclick="location.href='restaurant_admin.html'">
      🏪 店舗として登録する
    </button>
    <div class="register-note">※ 登録は無料です。掲載後はソムリンユーザーへ公開されます。</div>
  </div>`;
}

async function loadLocalStores(q) {
  const box = document.getElementById('localStores');
  if (!box) return;
  try {
    // クエリ整形（scouterからの「◯◯ ワイン」形式にも対応）
    const clean = (q || '').replace(/ワイン/g, ' ').trim();
    const tokens = clean.split(/\s+/).filter(t => t.length >= 2);
    const key = tokens.sort((a, b) => b.length - a.length)[0] || clean;
    if (!key) { box.innerHTML = emptyStoreHtml(q); return; }

    const H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };
    // RLS: 公開設定ONの店舗の行しか返らない（非公開店は自動的に除外される）
    const rw = await fetch(SB_URL + '/rest/v1/restaurant_wines'
      + '?select=owner_id,name,vintage,region,price_bottle,price_glass,stock'
      + '&available=eq.true&name=ilike.' + encodeURIComponent('*' + key + '*') + '&limit=100', { headers: H });
    let rows = rw.ok ? await rw.json() : [];
    if (tokens.length > 1) rows = rows.filter(r => matchWine(r.name, clean));
    if (!rows.length) { box.innerHTML = emptyStoreHtml(q); return; }

    // 店舗名・住所（restaurant_settings。公開店のみ読める）
    const owners = [...new Set(rows.map(r => r.owner_id))];
    const rs = await fetch(SB_URL + '/rest/v1/restaurant_settings?owner_id=in.(' + owners.join(',') + ')&select=owner_id,display_name,address', { headers: H });
    const settings = rs.ok ? await rs.json() : [];
    const byOwner = {}; settings.forEach(s => byOwner[s.owner_id] = s);

    const byStore = {};
    rows.forEach(r => {
      const s = byOwner[r.owner_id];
      if (!s || !s.display_name) return;   // 店舗名未設定の店は表示しない
      if (!byStore[r.owner_id]) byStore[r.owner_id] = { name: s.display_name, addr: s.address || '', wines: [] };
      byStore[r.owner_id].wines.push(r);
    });
    const stores = Object.entries(byStore);
    if (!stores.length) { box.innerHTML = emptyStoreHtml(q); return; }

    let html = `<div class="lstore-count">📍 ${stores.length}軒で取り扱いを確認</div>`;
    stores.forEach(([oid, store]) => {
      html += `<div class="lstore-card">
        <div class="lstore-head">
          <div>
            <div class="lstore-name">${escHtml(store.name)}</div>
            <div class="lstore-meta">🏪 登録店舗${store.addr ? '　📍 ' + escHtml(store.addr) : ''}</div>
          </div>
          <button class="lstore-inquiry" onclick="inquireStore('${oid}','${escHtml(store.name)}')">問い合わせ</button>
        </div>
        ${store.wines.map(w => {
          const price = w.price_bottle || w.price_glass || 0;
          const t = (w.price_bottle && w.price_glass) ? 'ボトル/グラス' : (w.price_glass ? 'グラス' : 'ボトル');
          return `
        <div class="lstore-wine">
          <div class="lstore-wine-info">
            <div class="lstore-wine-name">${escHtml(w.name)}</div>
            <div class="lstore-wine-meta">${escHtml(w.vintage || '')}　${escHtml(w.region || '')}</div>
          </div>
          <div class="lstore-wine-right">
            <div class="lstore-price">¥${price.toLocaleString()}</div>
            <div class="lstore-type">${t}</div>
          </div>
        </div>`;
        }).join('')}
      </div>`;
    });
    box.innerHTML = html;
  } catch (e) { box.innerHTML = emptyStoreHtml(q); }
}

function showQuickModal(title, msg) {
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;z-index:999;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);';
  m.innerHTML = `<div style="background:#fff;width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:24px 20px 36px;">
    <div style="font-size:15px;font-weight:800;color:#2C1810;margin-bottom:8px;">${title}</div>
    <div style="font-size:13px;color:#555;line-height:1.75;white-space:pre-line;margin-bottom:20px;">${msg}</div>
    <button onclick="this.closest('[style]').remove()" style="width:100%;padding:14px;background:#9B1B4B;color:#fff;font-size:14px;font-weight:800;border:none;border-radius:14px;cursor:pointer;">閉じる</button>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => { if(e.target===m) m.remove(); });
}

function clearResults() {

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
