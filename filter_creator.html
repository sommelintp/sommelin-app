<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ソムリン — 自分のフィルターを作る</title>
<meta name="theme-color" content="#5C0E2A">
<style>
:root{ --burgundy:#9B1B4B; --wine-dark:#5C0E2A; --gold:#C9973A; --bg:#F8F4EF; --text:#2C1810; --text-sub:#7A6055; --border:#E8DDD5; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:-apple-system,'Hiragino Sans',sans-serif; background:var(--bg); color:var(--text);
  max-width:430px; margin:0 auto; min-height:100dvh; padding:0 0 60px; }
.top{ background:linear-gradient(135deg,var(--wine-dark),var(--burgundy)); padding:52px 16px 20px; color:#fff;
  display:flex; align-items:center; gap:12px; }
.top a{ width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0; }
.top .t1{ font-size:17px; font-weight:800; }
.top .t2{ font-size:11px; color:rgba(255,255,255,.75); margin-top:1px; }
.wrap{ padding:16px; }
.fl{ font-size:12px; font-weight:800; color:var(--text); margin:16px 0 8px; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ background:#fff; border:1.5px solid var(--border); border-radius:20px; padding:8px 14px;
  font-size:13px; font-weight:700; color:var(--text-sub); cursor:pointer; }
.chip.on{ background:var(--burgundy); border-color:var(--burgundy); color:#fff; }
.emoji{ font-size:22px; padding:6px 10px; }
.row2{ display:flex; gap:10px; }
.row2 input{ flex:1; }
input[type=text], input[type=number]{ width:100%; border:1.5px solid var(--border); border-radius:12px;
  padding:12px 14px; font-size:14px; font-family:inherit; background:#fff; color:var(--text); outline:none; }
input:focus{ border-color:var(--burgundy); }
.toggle{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:1.5px solid var(--border);
  border-radius:12px; padding:12px 14px; }
.toggle-sw{ width:42px; height:24px; border-radius:12px; background:var(--border); position:relative; cursor:pointer; transition:.2s; }
.toggle-sw.on{ background:var(--burgundy); }
.toggle-sw::after{ content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff;
  top:3px; left:3px; transition:.2s; }
.toggle-sw.on::after{ left:21px; }
.preview{ background:#fff; border:1.5px solid var(--gold); border-radius:14px; padding:16px; text-align:center; margin-top:20px; }
.preview .pv{ font-size:28px; font-weight:800; color:var(--burgundy); }
.preview .pl{ font-size:12px; color:var(--text-sub); margin-top:4px; }
.submit{ width:100%; margin-top:20px; background:var(--burgundy); color:#fff; border:none; border-radius:14px;
  padding:15px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; }
.submit:disabled{ opacity:.5; }
#toast{ position:fixed; bottom:40px; left:50%; transform:translateX(-50%); background:rgba(15,15,15,.92); color:#fff;
  padding:10px 20px; border-radius:20px; font-size:13px; font-weight:700; opacity:0; transition:all .3s; z-index:400; white-space:nowrap; }
#toast.on{ opacity:1; }
</style>
</head>
<body>

<div class="top">
  <a href="filter_market.html">‹</a>
  <div>
    <div class="t1">🎨 自分のフィルターを作る</div>
    <div class="t2">条件を選んで公開・シェアしよう</div>
  </div>
</div>

<div class="wrap">
  <div class="fl">アイコン</div>
  <div class="chips" id="emojiChips">
    <div class="chip emoji on" data-v="🍷">🍷</div>
    <div class="chip emoji" data-v="🥂">🥂</div>
    <div class="chip emoji" data-v="💰">💰</div>
    <div class="chip emoji" data-v="🌸">🌸</div>
    <div class="chip emoji" data-v="🔥">🔥</div>
    <div class="chip emoji" data-v="🌿">🌿</div>
  </div>

  <div class="fl">タイプ（複数選択可・未選択なら全タイプ）</div>
  <div class="chips" id="iroChips">
    <div class="chip" data-v="赤">🍷 赤</div>
    <div class="chip" data-v="白">🥂 白</div>
    <div class="chip" data-v="泡">🍾 泡</div>
    <div class="chip" data-v="ロゼ">🌸 ロゼ</div>
    <div class="chip" data-v="オレンジ">🟠 オレンジ</div>
  </div>

  <div class="fl">産地（複数選択可・未選択なら全産地）</div>
  <div class="chips" id="kuniChips">
    <div class="chip" data-v="フランス">🇫🇷 フランス</div>
    <div class="chip" data-v="イタリア">🇮🇹 イタリア</div>
    <div class="chip" data-v="スペイン">🇪🇸 スペイン</div>
    <div class="chip" data-v="ドイツ">🇩🇪 ドイツ</div>
    <div class="chip" data-v="アメリカ">🇺🇸 アメリカ</div>
    <div class="chip" data-v="日本">🇯🇵 日本</div>
    <div class="chip" data-v="チリ">🇨🇱 チリ</div>
    <div class="chip" data-v="オーストラリア">🇦🇺 オーストラリア</div>
  </div>

  <div class="fl">価格帯</div>
  <div class="row2">
    <input type="number" id="priceMin" placeholder="下限 ¥">
    <input type="number" id="priceMax" placeholder="上限 ¥">
  </div>

  <div class="fl">評価</div>
  <div class="toggle">
    <span style="font-size:13px;font-weight:700;">評価の高いワインだけに絞る</span>
    <div class="toggle-sw" id="minSpToggle" onclick="this.classList.toggle('on');updatePreview();"></div>
  </div>

  <div class="fl">フィルター名 *</div>
  <input type="text" id="fTitle" placeholder="例: 週末に飲みたいコスパ赤" maxlength="40">

  <div class="fl">あなたの名前（任意）</div>
  <input type="text" id="fCreatorName" placeholder="例: ワイン太郎" maxlength="30">

  <div class="preview">
    <div class="pv" id="pvCount">—</div>
    <div class="pl">本のワインが該当します</div>
  </div>

  <button class="submit" id="submitBtn" onclick="createFilter()">🎉 このフィルターを公開する</button>
</div>

<div id="toast"></div>

<script>
const API_BASE = 'https://sommelin-trade-platform-1076605563046.asia-northeast1.run.app';
const UID = (() => { try {
  let u = localStorage.getItem('somm_uid');
  if (!u) { u = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); localStorage.setItem('somm_uid', u); }
  return u;
} catch(e){ return ''; } })();
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2600); }

function setupChips(id, multi) {
  document.getElementById(id).addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    if (id === 'emojiChips') { document.querySelectorAll('#emojiChips .chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); return; }
    c.classList.toggle('on');
    updatePreview();
  });
}
setupChips('emojiChips');
setupChips('iroChips', true);
setupChips('kuniChips', true);

function selected(id) { return Array.from(document.querySelectorAll('#'+id+' .chip.on')).map(c => c.dataset.v); }

function buildConditions() {
  const cond = {};
  const iro = selected('iroChips'); if (iro.length) cond.iro = iro;
  const kuni = selected('kuniChips'); if (kuni.length) cond.kuni = kuni;
  const pmin = document.getElementById('priceMin').value; if (pmin) cond.priceMin = Number(pmin);
  const pmax = document.getElementById('priceMax').value; if (pmax) cond.priceMax = Number(pmax);
  if (document.getElementById('minSpToggle').classList.contains('on')) cond.minSp = 6;
  return cond;
}

let pvTimer = null;
function updatePreview() {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(async () => {
    try {
      const r = await fetch(API_BASE + '/api/filters/preview?conditions=' + encodeURIComponent(JSON.stringify(buildConditions())));
      const d = await r.json();
      document.getElementById('pvCount').textContent = (d.count || 0).toLocaleString('ja-JP');
    } catch (e) { document.getElementById('pvCount').textContent = '—'; }
  }, 300);
}
['priceMin','priceMax'].forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

async function createFilter() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) return toast('フィルター名を入力してください');
  const emoji = document.querySelector('#emojiChips .chip.on').dataset.v;
  const creatorName = document.getElementById('fCreatorName').value.trim();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    const r = await fetch(API_BASE + '/api/filters', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ creatorUid: UID, creatorName: creatorName || null, title, emoji, conditions: buildConditions() })
    });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (window.sommLog) sommLog('filter_create', { title: title.slice(0, 40) });
    location.href = 'wine_search.html?filter=' + encodeURIComponent(d.id);
  } catch (e) {
    btn.disabled = false;
    toast('公開に失敗しました。通信環境をご確認ください');
  }
}

updatePreview();
</script>
<script>
/* ===== 利用ログ（app_events・書き込み専用。読み取り不可） ===== */
(function(){
  var PAGE='filter_creator';
  var U='https://gkhdpzfmqraliwaiubwl.supabase.co/rest/v1/app_events';
  var K='sb_publishable_p-8MZjT4azg59TAtQgChhA___PLMlDV';
  var uid='na';
  try{
    uid=localStorage.getItem('somm_uid');
    if(!uid){ uid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)); localStorage.setItem('somm_uid',uid); }
  }catch(e){}
  window.sommLog=function(event,meta){
    try{
      var role=null,auth=null;
      try{ role=localStorage.getItem('sommelin_role')||null; }catch(e){}
      try{ var t=JSON.parse(localStorage.getItem('sb-gkhdpzfmqraliwaiubwl-auth-token')||'null'); auth=(t&&t.user&&t.user.id)||null; }catch(e){}
      fetch(U,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K,'Prefer':'return=minimal'},
        body:JSON.stringify({uid:uid,auth_uid:auth,role:role,page:PAGE,event:event,meta:meta||null})}).catch(function(){});
    }catch(e){}
  };
  sommLog('page_view');
})();
</script>
</body>
</html>
