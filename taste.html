<style>
/* 2026-07-30: --burgundy/--wine-dark/--goldはsommelin-ui.cssのトークンに一本化 */
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  background:linear-gradient(160deg,var(--wine-dark) 0%,#3d0a1c 100%);
  color:#fff; max-width:430px; margin:0 auto; min-height:100dvh;
  padding:0 0 40px;
}
.top{padding:52px 16px 6px;display:flex;align-items:center;gap:12px;}
.top a{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;}
.top .t1{font-family:var(--font-display);font-size:17px;font-weight:700;}
.top .t2{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px;}
.top .titles{flex:1;}
.lang-toggle{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:12px;font-weight:700;
  padding:6px 12px;border-radius:14px;cursor:pointer;flex-shrink:0;}
.wrap{padding:10px 20px;}
.desc{font-size:13px;color:rgba(255,255,255,.75);line-height:1.8;margin-bottom:14px;}

/* profile card */
.prof{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px;margin-bottom:16px;}
.prof .ph{font-size:11px;color:rgba(255,255,255,.6);font-weight:700;}
.prof .pv{font-size:17px;font-weight:800;margin-top:6px;line-height:1.5;}
.prof .pn{font-size:11px;color:rgba(255,255,255,.55);margin-top:6px;line-height:1.6;}

/* source segment */
.seg{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:4px;margin-bottom:14px;}
.seg button{flex:1;border:none;background:none;color:rgba(255,255,255,.7);font-size:13px;font-weight:700;padding:10px;border-radius:10px;cursor:pointer;}
.seg button.on{background:#fff;color:var(--burgundy);}

.upload{width:100%;padding:16px;background:#fff;color:var(--burgundy);font-size:15px;font-weight:800;border:none;border-radius:16px;cursor:pointer;margin-bottom:10px;}
.upload:disabled{opacity:.5;}
/* iOS Safariでは display:none の input file への JS click が効かないケースがあるため、
   画面外に配置して見えないが有効な状態にする（クリックは伝播可能）。 */
.hidden-file{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
.note{font-size:10px;color:rgba(255,255,255,.45);line-height:1.7;margin-bottom:16px;}

/* status / results */
.stat{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);padding:8px 0;min-height:20px;}
.rec{background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;}
.rec .rn{font-size:13px;font-weight:700;line-height:1.4;}
.rec .rr{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;}
.rec .rm{font-size:10px;font-weight:800;white-space:nowrap;flex-shrink:0;
  padding:3px 9px;border-radius:10px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}
.rec .rm.hit{background:var(--gold);color:#3d2a05;}

.golink{display:block;text-align:center;margin-top:18px;padding:15px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:16px;color:#fff;font-size:14px;font-weight:800;text-decoration:none;}

#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(15,15,15,.92);color:#fff;
  padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:400;white-space:nowrap;}
#toast.on{opacity:1;}

/* フィルター確認カード */
.fsection{margin-top:18px;}
.fsection-head{font-size:12px;font-weight:800;color:rgba(255,255,255,.85);margin-bottom:8px;}
.fcard{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-card);padding:12px 14px;margin-bottom:8px;}
.fcard .fn{font-size:13px;font-weight:700;line-height:1.4;}
.fcard .fr{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
.fstars{font-size:20px;letter-spacing:2px;cursor:pointer;}
.fstar{color:rgba(255,255,255,.25);}
.fstar.on{color:var(--foil-pale);} /* ダーク背景上の金はfoil-pale（デザインシステム） */
.fcheck{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.75);cursor:pointer;white-space:nowrap;}
.fcomment{width:100%;margin-top:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-chip);
  padding:8px 10px;font-size:12px;color:#fff;font-family:inherit;resize:none;min-height:36px;}
.fcomment::placeholder{color:rgba(255,255,255,.4);}
.fsavebtn{width:100%;padding:14px;background:var(--gold);color:#3d2a05;font-size:14px;font-weight:800;
  border:none;border-radius:var(--r-card);cursor:pointer;margin-top:6px;}
.fsavebtn:disabled{opacity:.5;}
</style>

    link_filter: '🎨 Manage my filters →',
    link_scouter: '📷 Try it in Scouter →',
    stat_analyzing: (i, n) => `Analyzing… ${i}/${n} (about 10s)`,
    stat_done: (n) => `✅ ${n} wines added to your taste`,
    stat_none: '',

    toast_no_bottle: 'No bottle could be recognized',
    toast_analyze_fail: 'Analysis failed',

    toast_save_fail: 'Save failed',
    toast_saved: (n) => `🎨 Saved ${n} wine${n === 1 ? '' : 's'} to your filter`,
    toast_saved_limit: (n) => `Saved ${n} (daily limit reached)`,

    rec_of_5: '/5',
  },
};
let LANG = (() => { try { return localStorage.getItem('somm_lang') || (navigator.language && navigator.language.startsWith('ja') ? 'ja' : 'en'); } catch(e) { return 'ja'; } })();
function t(key, ...args) {
  const d = I18N[LANG] || I18N.ja;
  const v = (d && d[key] != null) ? d[key] : (I18N.ja[key] != null ? I18N.ja[key] : key);
  return typeof v === 'function' ? v(...args) : v;
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  const btn = document.getElementById('langBtn');
  if (btn) btn.textContent = LANG === 'ja' ? '🌐 EN' : '🌐 日本語';
  // 現在のプロファイル表示を再描画（多言語対応）
  if (window._lastProfile !== undefined) showProfile(window._lastProfile);
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('somm_lang', l); } catch(e) {}
  applyI18n();
  if (window.sommLog) sommLog('lang_switch', { lang: l });
}

// scouter.html と同じ設定を共有（匿名ID）。?api=/localStorage での差し替えはローカル開発時のみ有効（本番は固定）
const API_BASE = (()=>{
  const prod = 'https://sommelin-trade-platform-1076605563046.asia-northeast1.run.app';
  if(location.hostname!=='localhost' && location.hostname!=='127.0.0.1') return prod;
  const p = new URLSearchParams(location.search).get('api');
  if(p){ localStorage.setItem('somm_api_base', p.replace(/\/$/,'')); }
  return localStorage.getItem('somm_api_base') || prod;
})();
const UID=(()=>{ let u=localStorage.getItem('somm_uid');
  if(!u){ u=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)); localStorage.setItem('somm_uid',u); }
  return u; })();

let SOURCE='photo_like';
function setSource(s){
  SOURCE=s;
  document.getElementById('segLike').classList.toggle('on',s==='photo_like');
  document.getElementById('segCellar').classList.toggle('on',s==='cellar');
}

function esc(x){ return (x==null?'':String(x)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2400); }
function setStat(m){ document.getElementById('stat').textContent=m; }

function showProfile(p){
  window._lastProfile = p; // 言語切替時の再描画用に保持
  const v=document.getElementById('profVal'), n=document.getElementById('profNote');
  if(!p){ v.textContent=t('profile_dash'); n.textContent=''; return; }
  if(!p.count){ v.textContent=t('profile_empty_val'); n.textContent=t('profile_empty_note'); return; }
  if(p.ready && p.summary){ v.textContent=t('profile_ready_val', p.summary, p.count); n.textContent=t('profile_ready_note'); }
  else { v.textContent=t('profile_pending_val', p.count); n.textContent=t('profile_pending_note', Math.max(0,3-p.count)); }
}

async function loadProfile(){
  try{
    const r=await authFetch(API_BASE+'/api/taste/summary?userId='+encodeURIComponent(UID));
    if(r.ok){ const p = await r.json(); showProfile(p); }
    else { window._lastProfile=null; document.getElementById('profVal').textContent=t('profile_dash'); }
  }catch(e){ window._lastProfile=null; document.getElementById('profVal').textContent=t('profile_offline'); }
}

// 画像→長辺1568px JPEG（セラー写真は小さいラベルが多いので高めの解像度）
function toDataUrl(file){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const scale=Math.min(1, 1568/Math.max(img.naturalWidth,img.naturalHeight));
      c.width=Math.round(img.naturalWidth*scale); c.height=Math.round(img.naturalHeight*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg',0.8));
      URL.revokeObjectURL(img.src);
    };
    img.onerror=()=>resolve(null);
    img.src=URL.createObjectURL(file);
  });
}

function recRow(b){
  // 表示体系第4版: 味スコア(100点方式)＋ソムスター。どちらも無ければ「評価あり」とだけ
  const star = b.somStar!=null ? ' ' + '★'.repeat(Math.max(0,Math.min(5,Number(b.somStar)))) : '';
  const badge = b.matched
    ? (b.tasteScore100!=null ? t('rec_matched_prefix') + b.tasteScore100 + star : t('rec_matched_generic'))
    : t('rec_ok');
  return `<div class="rec">
    <div><div class="rn">${esc(b.name||t('rec_no_name'))}</div>
         <div class="rr">${esc([b.iro,b.kuni,b.chiiki,b.vintage].filter(Boolean).join('　'))}</div></div>
    <div class="rm${b.matched?' hit':''}">${esc(badge)}</div>
  </div>`;
}

// ===== フィルター確認（載せますか？）=====
let pendingItems = [];

function fstarsHtml(idx, rating){
  let h='';
  for(let i=1;i<=5;i++){ h+=`<span class="fstar${i<=(rating||0)?' on':''}" onclick="setRating(${idx},${i})">★</span>`; }
  return h;
}

function fcardHtml(item, idx){
  return `<div class="fcard" id="fcard-${idx}">
    <div class="fn">${esc(item.name||t('fcard_no_name'))}</div>
    <div class="fr">${esc([item.iro,item.kuni,item.chiiki,item.vintage].filter(Boolean).join('　'))}</div>
    <div class="frow">
      <div class="fstars" id="fstars-${idx}">${fstarsHtml(idx, item.rating)}</div>
      <label class="fcheck"><input type="checkbox" ${item.included?'checked':''} onchange="pendingItems[${idx}].included=this.checked"> ${esc(t('fcard_included_label'))}</label>
    </div>
    <textarea class="fcomment" placeholder="${esc(t('fcard_comment_ph'))}" oninput="pendingItems[${idx}].comment=this.value">${esc(item.comment||'')}</textarea>
  </div>`;
}

function setRating(idx, val){
  pendingItems[idx].rating = (pendingItems[idx].rating===val) ? null : val; // 同じ星の再タップで解除
  document.getElementById('fstars-'+idx).innerHTML = fstarsHtml(idx, pendingItems[idx].rating);
}

function renderFilterSection(){
  const sec=document.getElementById('fsection');
  if(!pendingItems.length){ sec.style.display='none'; return; }
  sec.style.display='block';
  document.getElementById('fcards').innerHTML = pendingItems.map((it,i)=>fcardHtml(it,i)).join('');
}

async function saveToFilter(){
  const toSave = pendingItems.filter(it=>it.included);
  if(!toSave.length){ toast(t('toast_pick_wine')); return; }
  const btn=document.getElementById('fsaveBtn'); btn.disabled=true;
  let saved=0, limitHit=false;
  const savedSet=new Set(); // 実際に保存できたものだけ後で除去（未保存の入力＝評価・コメントを消さない）
  for(const it of toSave){
    try{
      const r=await authFetch(API_BASE+'/api/filters/items',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ uid:UID, wine:{ name:it.name, producer:it.producer, iro:it.iro, kuni:it.kuni, chiiki:it.chiiki, vintage:it.vintage, price:it.price, wineId:it.wineId }, rating:it.rating, comment:it.comment })
      });
      if(r.status===429){ limitHit=true; break; }
      if(r.ok){ saved++; savedSet.add(it); }
    }catch(e){}
  }
  // 保存成功分だけを除去し、失敗・上限で残った分は入力内容ごと保持する
  pendingItems = pendingItems.filter(it => !savedSet.has(it));
  renderFilterSection();
  btn.disabled=false;
  if(limitHit) toast(t('toast_saved_limit', saved));
  else if(saved) toast(t('toast_saved', saved));
  else toast(t('toast_save_fail'));
}

async function handleFiles(files){
  if(window.sommLog) sommLog('taste_upload',{n:(files&&files.length)||0});
  if(!files || !files.length) return;
  const btn=document.getElementById('upBtn'); btn.disabled=true;
  const resEl=document.getElementById('results');
  let total=0;
  for(let i=0;i<files.length;i++){
    setStat(t('stat_analyzing', i+1, files.length));
    const dataUrl=await toDataUrl(files[i]);
    if(!dataUrl){ continue; }
    try{
      const r=await authFetch(API_BASE+'/api/taste/upload',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ image:dataUrl, userId:UID, source:SOURCE, locale: (LANG==='en'?'en-US':'ja-JP') })
      });
      if(r.status===429){ toast(t('toast_rate_limit')); break; }
      if(!r.ok) throw new Error('http '+r.status);
      const res=await r.json();
      total+=res.saved||0;
      (res.recognized||[]).forEach(b=>{
        resEl.insertAdjacentHTML('afterbegin', recRow(b));
        pendingItems.push({ name:b.name, producer:b.producer, iro:b.iro, kuni:b.kuni, chiiki:b.chiiki,
          vintage:b.vintage, price:b.price, wineId:b.wineId, rating:null, comment:'', included:true });
      });
      renderFilterSection();
      if(res.profile) showProfile(res.profile);
      if(!res.saved) toast(t('toast_no_bottle'));
    }catch(e){ toast(t('toast_analyze_fail')); }
  }
  setStat(total ? t('stat_done', total) : t('stat_none'));
  btn.disabled=false;
}

document.getElementById('file').addEventListener('change',e=>{ handleFiles(Array.from(e.target.files)); e.target.value=''; });
applyI18n();
loadProfile();
</script>
