<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sommelin — パスワード再設定</title>
<meta name="robots" content="noindex">
<style>
:root {
  --burgundy: #9B1B4B;
  --wine-dark: #5C0E2A;
  --burgundy-pale: #f9f0f3;
  --text: #2C1A1D;
  --text-sub: #7A5A62;
  --bg: #F5F3F0;
  --border: #ecdde2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.hero {
  background: linear-gradient(160deg, var(--wine-dark) 0%, var(--burgundy) 55%, #C84B6B 100%);
  padding: 52px 28px 40px;
  text-align: center;
}
.hero-name { color: white; font-size: 22px; font-weight: 900; margin-top: 10px; }
.hero-tagline { color: rgba(255,255,255,0.8); font-size: 13px; margin-top: 6px; }
.body-pad { flex: 1; padding: 28px 20px 48px; }
.pg-lead { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
.pg-sub { font-size: 13px; color: var(--text-sub); line-height: 1.7; margin-bottom: 24px; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 11px; font-weight: 700; color: var(--text-sub); letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
.form-input {
  width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 13px 16px; font-size: 15px; font-family: inherit;
  color: var(--text); outline: none; background: white;
}
.form-input:focus { border-color: var(--burgundy); box-shadow: 0 0 0 3px rgba(155,27,75,0.1); }
.form-input.error { border-color: #e53e3e; }
.input-wrap { position: relative; }
.input-wrap .form-input { padding-right: 44px; }
.pw-toggle {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-sub);
}
.btn-primary {
  width: 100%; background: var(--burgundy); color: white;
  border: none; border-radius: 14px; padding: 15px;
  font-size: 15px; font-weight: 800; cursor: pointer;
  font-family: inherit; margin-top: 4px;
}
.btn-primary:active { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.5; cursor: default; }
.switch-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-sub); }
.switch-link a { color: var(--burgundy); font-weight: 700; text-decoration: none; cursor: pointer; }
.state-center {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 24px; text-align: center;
}
.state-icon { font-size: 56px; margin-bottom: 18px; }
.state-title { font-size: 19px; font-weight: 900; margin-bottom: 10px; }
.state-sub { font-size: 13px; color: var(--text-sub); line-height: 1.7; margin-bottom: 24px; }
.toast {
  position: fixed; bottom: 40px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #1a1a2e; color: white;
  padding: 12px 20px; border-radius: 12px;
  font-size: 13px; font-weight: 600;
  z-index: 500; transition: transform 0.3s ease; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.loading-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(255,255,255,0.92); z-index: 300;
  flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.loading-overlay.open { display: flex; }
.spinner {
  width: 44px; height: 44px;
  border: 4px solid rgba(155,27,75,0.15);
  border-top-color: var(--burgundy);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="formView" style="display:none;flex-direction:column;flex:1;">
  <div class="hero">
    <div class="hero-name">Sommelin</div>
    <div class="hero-tagline">新しいパスワードを設定してください</div>
  </div>
  <div class="body-pad">
    <div class="pg-lead">パスワード再設定</div>
    <div class="pg-sub">8文字以上の新しいパスワードを入力してください。</div>
    <div class="form-group">
      <label class="form-label">新しいパスワード</label>
      <div class="input-wrap">
        <input class="form-input" id="pw1" type="password" placeholder="8文字以上" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('pw1',this)">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">新しいパスワード（確認）</label>
      <div class="input-wrap">
        <input class="form-input" id="pw2" type="password" placeholder="もう一度入力" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('pw2',this)">👁</button>
      </div>
    </div>
    <button class="btn-primary" id="submitBtn" onclick="submitNewPassword()">パスワードを変更する</button>
    <div class="switch-link"><a href="login.html">ログイン画面に戻る</a></div>
  </div>
</div>

<div id="invalidView" class="state-center" style="display:none;">
  <div class="state-icon">⚠️</div>
  <div class="state-title">リンクが無効です</div>
  <div class="state-sub">このリンクは期限切れか、すでに使用されています。<br>もう一度パスワード再設定をお試しください。</div>
  <a href="login.html" class="btn-primary" style="text-decoration:none;display:block;text-align:center;line-height:1.2;padding-top:15px;">ログイン画面へ</a>
</div>

<div id="successView" class="state-center" style="display:none;">
  <div class="state-icon">✅</div>
  <div class="state-title">パスワードを変更しました</div>
  <div class="state-sub">新しいパスワードでログインしてください。</div>
  <a href="login.html" class="btn-primary" style="text-decoration:none;display:block;text-align:center;line-height:1.2;padding-top:15px;">ログイン画面へ</a>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://gkhdpzfmqraliwaiubwl.supabase.co';
const SB_KEY = 'sb_publishable_p-8MZjT4azg59TAtQgChhA___PLMlDV';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function showLoading() { document.getElementById('loadingOverlay').classList.add('open'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('open'); }
function togglePw(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

// Supabaseのパスワード再設定メールは #access_token=...&type=recovery&refresh_token=... という
// URLハッシュ付きでこのページにリダイレクトしてくる（2026-07-08新規作成: 従来このページ自体が
// 存在せず404になっていた）。
let recoveryToken = null;
(function parseRecoveryHash() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const accessToken = hash.get('access_token');
  const type = hash.get('type');
  if (accessToken && type === 'recovery') {
    recoveryToken = accessToken;
    document.getElementById('formView').style.display = 'flex';
  } else {
    document.getElementById('invalidView').style.display = 'flex';
  }
})();

async function submitNewPassword() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if (!pw1 || pw1.length < 8) { showToast('8文字以上で入力してください'); return; }
  if (pw1 !== pw2) { showToast('パスワードが一致しません'); return; }
  if (!recoveryToken) { showToast('リンクが無効です'); return; }
  showLoading();
  try {
    const r = await fetch(SB_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + recoveryToken },
      body: JSON.stringify({ password: pw1 }),
    });
    hideLoading();
    if (!r.ok) { const d = await r.json().catch(() => ({})); showToast(d.msg || d.error_description || '変更に失敗しました'); return; }
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'flex';
  } catch (e) {
    hideLoading();
    showToast('通信エラーが発生しました');
  }
}
</script>
</body>
</html>
