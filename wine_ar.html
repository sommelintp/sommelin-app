<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ソムリンAR — ワインスキャナー</title>
<style>
:root { --burgundy:#9B1B4B; --wine-dark:#5C0E2A; --gold:#C9973A; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  background:#000; color:#fff;
  max-width:430px; margin:0 auto;
  height:100dvh; overflow:hidden;
}

/* ── PERMISSION ── */
#perm{
  position:fixed;inset:0;
  background:linear-gradient(160deg,var(--wine-dark) 0%,#3d0a1c 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;text-align:center;z-index:500;
}
#perm.gone{display:none;}
.perm-em{font-size:60px;margin-bottom:18px;}
.perm-title{font-size:23px;font-weight:800;margin-bottom:8px;line-height:1.3;}
.perm-desc{font-size:13px;color:rgba(255,255,255,.7);line-height:1.8;margin-bottom:24px;}
.perm-feats{
  text-align:left;width:100%;
  background:rgba(255,255,255,.1);border-radius:14px;
  padding:14px 16px;margin-bottom:26px;
}
.pf{font-size:13px;color:rgba(255,255,255,.85);padding:5px 0;display:flex;gap:8px;align-items:flex-start;}
.perm-main{
  width:100%;padding:16px;background:#fff;
  color:var(--burgundy);font-size:16px;font-weight:800;
  border:none;border-radius:16px;cursor:pointer;margin-bottom:12px;
}
.perm-demo{background:none;border:none;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer;text-decoration:underline;}

/* ── AR CONTAINER ── */
#ar{position:fixed;inset:0;max-width:430px;margin:0 auto;display:none;}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

/* Demo shelf background */
#demoBg{position:absolute;inset:0;display:none;
  background:linear-gradient(160deg,#160703 0%,#2d1007 30%,#1a0805 70%,#0d0403 100%);}
#demoBg.on{display:block;}
.sl{position:absolute;left:0;right:0;height:5px;
  background:linear-gradient(90deg,#3d2010,#8B6914,#a07820,#8B6914,#3d2010);
  box-shadow:0 3px 10px rgba(0,0,0,.6);}
.sl1{top:38%}.sl2{top:71%}
.shelf-row{position:absolute;left:0;right:0;display:flex;justify-content:space-around;padding:0 6%;}
.sr1{top:10%}.sr2{top:42%}
.btl{display:flex;flex-direction:column;align-items:center;gap:3px;}
.btl-b{
  width:20px;height:65px;
  background:linear-gradient(180deg,#1a0a04 0%,#5c2a08 30%,#8B4010 55%,#5c2a08 80%,#2a1008 100%);
  border-radius:35% 35% 6% 6% / 20% 20% 4% 4%;
  position:relative;
  box-shadow:-2px 1px 5px rgba(0,0,0,.7),inset 2px 0 5px rgba(255,180,80,.1);
}
.btl-b::before{
  content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:8px;height:12px;
  background:linear-gradient(180deg,#3a1a08,#1a0a04);
  border-radius:50% 50% 0 0;
}
.btl-lbl{
  position:absolute;top:24%;left:2px;right:2px;height:24px;
  background:linear-gradient(135deg,#F5E6C8,#DFC98A);
  border-radius:2px;
}
.btl-nm{font-size:7px;color:rgba(255,255,255,.4);text-align:center;max-width:36px;}

/* Scan line */
#scanLine{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,rgba(0,220,170,0) 5%,rgba(0,220,170,.9) 50%,rgba(0,220,170,0) 95%,transparent 100%);
  box-shadow:0 0 14px rgba(0,220,170,.7),0 0 28px rgba(0,220,170,.3);
  animation:scanMove 3s ease-in-out infinite;
  z-index:15;pointer-events:none;
}
@keyframes scanMove{0%{top:14%}50%{top:78%}100%{top:14%}}

/* Frame corners */
.fc{position:absolute;width:30px;height:30px;z-index:15;pointer-events:none;}
.fc.tl{top:14%;left:16px;border-top:2px solid rgba(0,220,170,.6);border-left:2px solid rgba(0,220,170,.6);}
.fc.tr{top:14%;right:16px;border-top:2px solid rgba(0,220,170,.6);border-right:2px solid rgba(0,220,170,.6);}
.fc.bl{top:78%;left:16px;border-bottom:2px solid rgba(0,220,170,.6);border-left:2px solid rgba(0,220,170,.6);}
.fc.br{top:78%;right:16px;border-bottom:2px solid rgba(0,220,170,.6);border-right:2px solid rgba(0,220,170,.6);}

/* Wine markers */
#mLayer{position:absolute;inset:0;z-index:20;pointer-events:none;}
.wm{position:absolute;transform:translate(-50%,-50%);pointer-events:all;display:none;}
.wm.on{display:block;animation:wmIn .45s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes wmIn{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.wm-ring{
  width:70px;height:70px;border-radius:50%;
  border:2.5px solid var(--c,#9B1B4B);
  box-shadow:0 0 20px var(--g,rgba(155,27,75,.6)),inset 0 0 10px rgba(0,0,0,.1);
  animation:rPulse 1.9s ease-in-out infinite;
  cursor:pointer;position:relative;
}
@keyframes rPulse{0%{transform:scale(.88);opacity:.8}50%{transform:scale(1.1);opacity:1}100%{transform:scale(.88);opacity:.8}}
.wm-badge{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--c,#9B1B4B);color:#fff;
  font-size:11px;font-weight:800;
  padding:4px 10px;border-radius:20px;
  white-space:nowrap;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
  animation:bFloat 2.6s ease-in-out infinite;
  display:flex;align-items:center;gap:5px;
}
@keyframes bFloat{0%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}100%{transform:translateX(-50%) translateY(0)}}
.wm-sc{background:rgba(255,255,255,.25);padding:1px 6px;border-radius:10px;font-size:10px;}
.wm-hint{font-size:9px;color:rgba(255,255,255,.65);text-align:center;margin-top:5px;letter-spacing:.02em;}

/* Scanning center */
#scanStatus{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);z-index:22;text-align:center;pointer-events:none;}
#scanStatus.gone{display:none;}
.ss-ring{width:108px;height:108px;border:2px dashed rgba(0,220,170,.4);border-radius:50%;margin:0 auto 14px;animation:spin 5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ss-txt{font-size:13px;font-weight:700;color:rgba(255,255,255,.8);text-shadow:0 1px 4px rgba(0,0,0,.6);}

/* Top bar */
.aTop{
  position:absolute;top:0;left:0;right:0;z-index:30;
  padding:50px 18px 14px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(0,0,0,.65) 0%,transparent 100%);
}
.aTop-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.35);border:none;color:#fff;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);flex-shrink:0;
}
.aTop-title{flex:1;text-align:center;}
.aTop-title .t1{font-size:15px;font-weight:800;}
.aTop-title .t2{font-size:10px;color:rgba(255,255,255,.6);margin-top:1px;}
#detBadge{
  background:rgba(0,220,170,.15);border:1px solid rgba(0,220,170,.5);
  color:rgba(0,220,170,1);font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:20px;display:none;
}
#detBadge.on{display:block;}

/* Bottom panel */
.aBot{
  position:absolute;bottom:0;left:0;right:0;z-index:30;
  padding:10px 0 34px;
  background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.5) 65%,transparent 100%);
}
.lens-active-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
#activePill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:20px;
  font-size:12px;font-weight:800;color:#fff;
}
.lap-change{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  border-radius:14px;padding:4px 10px;
  font-size:11px;color:rgba(255,255,255,.75);cursor:pointer;font-weight:600;
}
#lensBar{display:flex;gap:8px;padding:0 14px;overflow-x:auto;scrollbar-width:none;}
#lensBar::-webkit-scrollbar{display:none;}
.lc{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 13px;background:rgba(255,255,255,.1);
  border:2px solid transparent;border-radius:14px;cursor:pointer;
  position:relative;transition:background .2s,border-color .2s;
}
.lc.on{background:rgba(255,255,255,.2);}
.lc-em{font-size:20px;}
.lc-nm{font-size:10px;color:rgba(255,255,255,.8);font-weight:700;white-space:nowrap;}
.lc-ct{font-size:9px;color:rgba(255,255,255,.45);}
.lc-lock{position:absolute;top:4px;right:4px;font-size:9px;}

/* ── DETAIL SHEET ── */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s;}
#backdrop.on{opacity:1;pointer-events:all;}
#sheet{
  position:fixed;bottom:0;left:50%;max-width:430px;width:100%;
  transform:translateX(-50%) translateY(108%);
  background:#fff;border-radius:22px 22px 0 0;
  z-index:90;padding-bottom:36px;color:#2C1810;
  transition:transform .36s cubic-bezier(.34,1.56,.64,1);
}
#sheet.on{transform:translateX(-50%) translateY(0);}
.sh-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:12px auto;}
.sh-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:20px;
  font-size:11px;font-weight:800;color:#fff;
  margin:0 20px 8px;
}
.sh-name{font-size:20px;font-weight:800;padding:0 20px;line-height:1.25;}
.sh-region{font-size:12px;color:#888;padding:4px 20px 12px;}
.sh-score-row{
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;border-top:1px solid #f2f2f2;border-bottom:1px solid #f2f2f2;
}
.sh-score{font-size:44px;font-weight:900;line-height:1;}
.sh-score-lbl{font-size:11px;color:#888;margin-top:2px;}
.sh-reason{margin:14px 16px;background:#fafafa;border-radius:12px;padding:12px 14px;border-left:3px solid #ccc;}
.sh-r-lbl{font-size:10px;font-weight:800;letter-spacing:.07em;margin-bottom:6px;}
.sh-r-txt{font-size:13px;color:#444;line-height:1.75;}
.sh-btns{display:flex;gap:10px;padding:0 16px;}
.sh-main{flex:1;padding:14px;background:var(--burgundy);color:#fff;font-size:14px;font-weight:800;border:none;border-radius:14px;cursor:pointer;}
.sh-sub{padding:14px 16px;background:#f5f3f0;color:#555;font-size:13px;border:none;border-radius:14px;cursor:pointer;}

/* ── LENS BUY MODAL ── */
#lbModal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);}
#lbModal.on{display:flex;}
.lb-box{
  background:#fff;width:100%;max-width:430px;
  border-radius:24px 24px 0 0;padding:24px 20px 44px;color:#2C1810;
  animation:upSlide .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes upSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.lb-em{font-size:48px;text-align:center;margin-bottom:8px;}
.lb-title{font-size:18px;font-weight:800;text-align:center;margin-bottom:4px;}
.lb-sub{font-size:13px;color:#888;text-align:center;margin-bottom:16px;line-height:1.6;}
.lb-price{text-align:center;margin-bottom:20px;}
.lb-pnum{font-size:38px;font-weight:900;color:var(--burgundy);}
.lb-psub{font-size:12px;color:#888;}
.lb-feats{background:#f9f7f5;border-radius:12px;padding:12px 14px;margin-bottom:20px;}
.lb-feat{font-size:13px;color:#444;padding:5px 0;border-bottom:1px solid #eee;display:flex;gap:8px;}
.lb-feat:last-child{border:none;}
.lb-buy{width:100%;padding:16px;background:linear-gradient(135deg,#9B1B4B,#5C0E2A);color:#fff;font-size:16px;font-weight:800;border:none;border-radius:16px;cursor:pointer;margin-bottom:10px;}
.lb-cancel{width:100%;padding:12px;background:none;color:#888;font-size:14px;border:none;cursor:pointer;}

/* Toast */
#toast{
  position:fixed;bottom:110px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:rgba(15,15,15,.9);color:#fff;
  padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:700;
  opacity:0;transition:all .3s;z-index:400;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<!-- ① PERMISSION SCREEN -->
<div id="perm">

  <div id="scanLine"></div>

</div>

<!-- ④ LENS BUY MODAL -->
<div id="lbModal" onclick="if(event.target===this)closeLensBuy()">
  <div class="lb-box">

    ld:{

      sommelin:{ on:true,  sc:99,    txt:'ソムリン最高評価。生涯に一度は飲むべきワイン。希少性・品質ともに世界最高峰。' },
      kamisama:{ on:true,  sc:'∞',   txt:'神の雫 第8巻で「神の雫」のひとつとして登場。遠峰一青が「これは神の涙だ」と語った伝説のシーン。' },
      suckling:{ on:true,  sc:100,   txt:'"Perfection. The greatest Romanée-Conti I have ever tasted." — James Suckling 2022' },
      parker:  { on:true,  sc:'99+', txt:'"As close to perfection as one can imagine from this mythical vineyard." — Robert Parker' },
      decanter:{ on:false, sc:null,  txt:null },
    }
  },
  { id:2, x:44, y:68,
    name:'Sassicaia', vintage:'2020', region:'Bolgheri Sassicaia DOC, Tuscany',
    ld:{
      personal:{ on:true,  sc:94,    txt:'カベルネ好きのあなたに。イタリアのスーパータスカンの王様。コスパも含め大変おすすめです。' },
      sommelin:{ on:false, sc:null,  txt:null },
      kamisama:{ on:true,  sc:93,    txt:'神の雫 第15巻に登場。「イタリアが生んだ奇跡のワイン。大地の詩だ」と評された一節が印象的。' },
      suckling:{ on:true,  sc:96,    txt:'"Stunning texture and complexity. A great Sassicaia." — James Suckling 2023' },
      parker:  { on:true,  sc:95,    txt:'"A great Sassicaia. Drink now or hold for 20 years." — Robert Parker' },
      decanter:{ on:true,  sc:'金賞', txt:'Decanter 2022 イタリア部門最高賞・5年連続受賞。' },
    }
  },
  { id:3, x:74, y:26,
    name:'Penfolds Grange', vintage:'2018', region:'South Australia, Australia',
    ld:{
      personal:{ on:false, sc:null,  txt:null },

      kamisama:{ on:false, sc:null,  txt:null },
      suckling:{ on:true,  sc:97,    txt:'"The greatest Australian wine, period." — James Suckling' },
      parker:  { on:true,  sc:96,    txt:'"Penfolds Grange continues to be one of the world\'s greatest red wines." — Robert Parker' },
      decanter:{ on:true,  sc:'金賞', txt:'Decanter 2022 ニューワールド部門最高賞。' },

];

// ── STATE ─────────────────────────────────────────────────────
let currentLens   = 'sommelin';
let scanDone      = false;
let purchased     = new Set(['personal','sommelin','kamisama']);

// ── BOOT ──────────────────────────────────────────────────────
function init() {
  buildLensBar();
  buildMarkers();
}

function buildMarkers() {
  document.getElementById('mLayer').innerHTML = WINES.map(w => `
    <div class="wm" id="wm${w.id}" style="left:${w.x}%;top:${w.y}%" onclick="tapWine(${w.id})">
      <div class="wm-ring" id="ring${w.id}"></div>
      <div class="wm-badge" id="badge${w.id}">
        <span>おすすめ！</span><span class="wm-sc" id="sc${w.id}"></span>
      </div>
      <div class="wm-hint">タップして詳細</div>
    </div>`).join('');
}

function buildLensBar() {
  document.getElementById('lensBar').innerHTML = LENSES.map(l => {
    const owned = purchased.has(l.id);
    const cnt   = WINES.filter(w => w.ld[l.id]?.on).length;
    return `<div class="lc${l.id===currentLens?' on':''}" id="lc${l.id}"
              style="${l.id===currentLens?`border-color:${l.color}`:''}"
              onclick="tapLens('${l.id}')">
      ${!owned?'<div class="lc-lock">🔒</div>':''}
      <div class="lc-em">${l.emoji}</div>
      <div class="lc-nm">${l.name}</div>
      <div class="lc-ct">${owned ? cnt+'本検出' : '¥'+l.price}</div>
    </div>`;
  }).join('');
}

// ── CAMERA ────────────────────────────────────────────────────
async function startAR() {
  document.getElementById('perm').classList.add('gone');
  document.getElementById('ar').style.display = 'block';
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    document.getElementById('cam').srcObject = s;
  } catch(e) { startDemoBg(); }
  beginScan();
}

function startDemo() {
  document.getElementById('perm').classList.add('gone');
  document.getElementById('ar').style.display = 'block';
  startDemoBg();
  beginScan();
}
function startDemoBg() { document.getElementById('demoBg').classList.add('on'); }

function beginScan() {
  setLens(currentLens);
  setTimeout(() => {
    scanDone = true;
    document.getElementById('scanStatus').classList.add('gone');
    refreshMarkers();
    const n = visCount();
    document.getElementById('arSub').textContent  = n + '本を検出';
    document.getElementById('detBadge').textContent = n + '本検出';
    if(n > 0) document.getElementById('detBadge').classList.add('on');
  }, 1700);
}

// ── LENS ──────────────────────────────────────────────────────
function tapLens(id) {
  if (!purchased.has(id)) { openLensBuy(id); return; }
  setLens(id);
}

function setLens(id) {
  currentLens = id;
  const l = LENSES.find(x=>x.id===id);
  // active pill
  const pill = document.getElementById('activePill');
  pill.textContent = l.emoji + ' ' + l.name;
  pill.style.background = l.color;
  // chips
  LENSES.forEach(x => {
    const el = document.getElementById('lc'+x.id);
    if(!el) return;
    el.classList.toggle('on', x.id===id);
    el.style.borderColor = x.id===id ? x.color : 'transparent';
    const ct = el.querySelector('.lc-ct');
    if(purchased.has(x.id)) ct.textContent = WINES.filter(w=>w.ld[x.id]?.on).length + '本検出';
  });
  if(scanDone) {
    refreshMarkers();
    const n = visCount();
    document.getElementById('arSub').textContent = n + '本を検出';
    document.getElementById('detBadge').textContent = n + '本検出';
    document.getElementById('detBadge').classList.toggle('on', n>0);
  }
}

function refreshMarkers() {
  const l = LENSES.find(x=>x.id===currentLens);
  WINES.forEach(w => {
    const el  = document.getElementById('wm'+w.id);
    const ring= document.getElementById('ring'+w.id);
    const bdg = document.getElementById('badge'+w.id);
    const sc  = document.getElementById('sc'+w.id);
    const d   = w.ld[currentLens];
    const show= d?.on && purchased.has(currentLens);
    // Toggle: remove then re-add to re-trigger animation
    el.classList.remove('on');
    if(show) {
      void el.offsetWidth; // reflow
      el.classList.add('on');
      ring.style.cssText = `width:70px;height:70px;border-radius:50%;border:2.5px solid ${l.color};box-shadow:0 0 20px ${l.glow},inset 0 0 10px rgba(0,0,0,.1);animation:rPulse 1.9s ease-in-out infinite;cursor:pointer;position:relative;`;
      bdg.style.background = l.color;
      sc.textContent = d.sc ?? '';
    }
  });
}

function visCount() {
  return WINES.filter(w => w.ld[currentLens]?.on && purchased.has(currentLens)).length;
}

// ── WINE DETAIL ───────────────────────────────────────────────
function tapWine(id) {
  const w = WINES.find(x=>x.id===id);
  const l = LENSES.find(x=>x.id===currentLens);
  const d = w.ld[currentLens];
  if(!d?.on) return;

  const pill = document.getElementById('shPill');
  pill.textContent = l.emoji + ' ' + l.name;
  pill.style.background = l.color;

  document.getElementById('shName').textContent    = w.name + '　' + w.vintage;
  document.getElementById('shRegion').textContent  = w.region;

  const sc = document.getElementById('shScore');
  sc.textContent = d.sc ?? '—';
  sc.style.color = l.color;
  document.getElementById('shScoreLbl').textContent = l.scoreLbl ?? 'スコア';

  const rb = document.getElementById('shReason');
  rb.style.borderLeftColor = l.color;
  const rl = document.getElementById('shRLbl');
  rl.textContent = l.name.toUpperCase() + "'S PICK";
  rl.style.color = l.color;
  document.getElementById('shRTxt').textContent = d.txt ?? '—';

  document.getElementById('shBuy').onclick = () => {
    closeSheet();
    const q = encodeURIComponent(w.name + ' ワイン');
    window.location.href = 'wine_search.html?q=' + q;
  };

  document.getElementById('backdrop').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}

function closeSheet() {
  document.getElementById('backdrop').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}

// ── LENS PURCHASE ─────────────────────────────────────────────
function openLensBuy(id) {
  const l = LENSES.find(x=>x.id===id);
  document.getElementById('lbEm').textContent    = l.emoji;
  document.getElementById('lbTitle').textContent = l.name + ' レンズ';
  document.getElementById('lbSub').textContent   = l.desc;
  document.getElementById('lbPrice').textContent = '¥' + l.price;
  document.getElementById('lbFeats').innerHTML   = (l.feats||[]).map(f=>`<div class="lb-feat">✓ <span>${f}</span></div>`).join('');
  document.getElementById('lbBuyBtn').onclick = () => {
    purchased.add(id);
    closeLensBuy();
    buildLensBar();
    setLens(id);
    toast(l.emoji + ' ' + l.name + ' レンズを追加しました！');
  };
  document.getElementById('lbModal').classList.add('on');
}
function closeLensBuy() { document.getElementById('lbModal').classList.remove('on'); }

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2600);
}

init();
</script>
