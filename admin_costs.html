<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLM原価ダッシュボード — ソムリン管理</title>
<meta name="robots" content="noindex">
<style>
  :root { --burgundy:var(--wine,#9B1B4B); --wine-dark:#5C0E2A; --gold:var(--foil,#C9973A); --bg:var(--paper,#F8F4EF); --text:var(--wine-ink,#2C1810); --sub:var(--text-sub,#8a7a7d); --border:var(--line,#e8e0da); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Hiragino Sans',sans-serif; background:var(--bg); color:var(--text); max-width:720px; margin:0 auto; padding-bottom:60px; }
  .header { background:linear-gradient(135deg,var(--wine-dark),var(--burgundy)); color:#fff; padding:20px 16px; }
  .header h1 { font-size:17px; }
  .header .sub { font-size:11px; opacity:.75; margin-top:3px; }
  .toolbar { display:flex; gap:8px; align-items:center; padding:12px 16px; }
  .toolbar select { font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid var(--border); font-family:inherit; }
  .total-card { margin:4px 16px 14px; background:#fff; border-radius:14px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); display:flex; gap:20px; }
  .total-item .v { font-size:22px; font-weight:900; color:var(--burgundy); }
  .total-item .l { font-size:10.5px; color:var(--sub); font-weight:600; margin-top:2px; }
  .day-block { margin:0 16px 14px; background:#fff; border-radius:14px; padding:14px 16px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .day-head { display:flex; justify-content:space-between; font-size:13px; font-weight:800; margin-bottom:8px; }
  .day-cost { color:var(--burgundy); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; color:var(--sub); font-size:10.5px; padding:4px 4px; border-bottom:1px solid var(--border); }
  td { padding:5px 4px; border-bottom:1px solid #f4efe9; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .msg { text-align:center; padding:50px 20px; color:var(--sub); font-size:13px; line-height:1.8; }
  .model-tag { font-size:10px; color:var(--sub); }
</style>
<link rel="stylesheet" href="assets/sommelin-ui.css?v=20260730">
</head>
<body>

<div class="header">
  <h1>💰 LLM原価ダッシュボード</h1>
  <div class="sub">機能別・日別・モデル別のAI利用コスト（管理者専用）</div>
</div>

<div class="toolbar">
  期間:
  <select id="daysSel" onchange="load()">
    <option value="7">7日</option>
    <option value="30" selected>30日</option>
    <option value="90">90日</option>
  </select>
  <select id="rateSel" onchange="renderAll()">
    <option value="150">$1 = ¥150</option>
    <option value="155">$1 = ¥155</option>
    <option value="160">$1 = ¥160</option>
  </select>
</div>

<div id="content"><div class="msg">読み込み中…</div></div>

<script>
const API_BASE = 'https://sommelin-trade-platform-1076605563046.asia-northeast1.run.app';
const FEATURE_JA = {
  scan_shelf: '📷 棚/ボトルスキャン', scan_list: '📋 リスト読み取り', back_label: '📸 裏ラベル',
  identify: '📷 単体照合', taste_upload: '❤️ 好み登録', chat: '💬 チャット', chat_photo: '💬 チャット写真', ig_search: '🔎 IG検索',
};
let lastData = null;

function token(){
  try { const s = JSON.parse(localStorage.getItem('sommelin_session')||'null'); return s && s.access_token; } catch(e){ return null; }
}

async function load(){
  const box = document.getElementById('content');
  const tk = token();
  if (!tk) { box.innerHTML = '<div class="msg">ログインが必要です。<br>ホーム（prototype.html）で管理者アカウントにログインしてから、このページを開き直してください。</div>'; return; }
  box.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const days = document.getElementById('daysSel').value;
    const r = await fetch(API_BASE + '/api/admin/llm-costs?days=' + days, { headers: { Authorization: 'Bearer ' + tk } });
    if (r.status === 401 || r.status === 403) { box.innerHTML = '<div class="msg">このページは管理者専用です。<br>管理者アカウントでログインしてください。</div>'; return; }
    if (!r.ok) throw new Error('http ' + r.status);
    lastData = await r.json();
    renderAll();
  } catch (e) {
    box.innerHTML = '<div class="msg">読み込みに失敗しました。時間をおいて再度お試しください。</div>';
  }
}

function yen(usd){ const rate = Number(document.getElementById('rateSel').value); return '¥' + Math.round(usd * rate).toLocaleString(); }
function usd(v){ return '$' + v.toFixed(v < 1 ? 3 : 2); }
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderAll(){
  if (!lastData) return;
  const box = document.getElementById('content');
  const rows = lastData.rows || [];
  if (!rows.length) { box.innerHTML = '<div class="msg">まだ記録がありません。<br>スキャンやチャットが使われると、ここに原価が積み上がります。</div>'; return; }

  // 日別にグループ
  const byDay = {};
  rows.forEach(r => { (byDay[r.day] = byDay[r.day] || []).push(r); });

  let html = `<div class="total-card">
    <div class="total-item"><div class="v">${usd(lastData.totalUsd)}</div><div class="l">合計（${lastData.days}日間）</div></div>
    <div class="total-item"><div class="v">${yen(lastData.totalUsd)}</div><div class="l">円換算</div></div>
    <div class="total-item"><div class="v">${rows.reduce((s,r)=>s+r.calls,0).toLocaleString()}</div><div class="l">AI呼び出し回数</div></div>
  </div>`;

  Object.keys(byDay).sort((a,b)=>b.localeCompare(a)).forEach(day => {
    const dayRows = byDay[day];
    const dayCost = dayRows.reduce((s,r)=>s+r.costUsd,0);
    html += `<div class="day-block">
      <div class="day-head"><span>${esc(day)}</span><span class="day-cost">${usd(dayCost)}（${yen(dayCost)}）</span></div>
      <table>
        <tr><th>機能</th><th class="num">回数</th><th class="num">入力tok</th><th class="num">出力tok</th><th class="num">費用</th></tr>
        ${dayRows.map(r => `<tr>
          <td>${esc(FEATURE_JA[r.feature]||r.feature)}<div class="model-tag">${esc(r.model)}</div></td>
          <td class="num">${r.calls}</td>
          <td class="num">${(r.inputTokens + r.cacheReadTokens + r.cacheWriteTokens).toLocaleString()}</td>
          <td class="num">${r.outputTokens.toLocaleString()}</td>
          <td class="num">${r.costUnknown ? '単価未登録' : usd(r.costUsd)}</td>
        </tr>`).join('')}
      </table>
    </div>`;
  });
  box.innerHTML = html;
}

load();
</script>
</body>
</html>
